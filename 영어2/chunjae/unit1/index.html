<body class="app-like bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const textData = [
          // Intro
          { id: 1, text: "We often see individuals who manage to accomplish seemingly impossible tasks.", trans: "우리는 겉보기에 불가능해 보이는 일을 성취해 내는 사람들을 종종 보게 된다." },
          { id: 2, text: "It almost appears as if they possessed the ability to ignite their own spirits.", trans: "이들은 흡사 자기 영혼에 불을 붙이는 능력을 지닌 것만 같다." },
          { id: 3, text: "They could be innovators who achieve success after countless trials and errors, athletes who push themselves tirelessly until they go beyond their limits, or activists who are willing to take risks to pursue what they believe is right.", trans: "그들은 수없이 많은 시행착오 끝에 성공을 거두는 혁신가일 수도 있고, 자신의 한계를 넘어설 때까지 쉬지 않고 자신을 밀어붙이는 운동선수일 수도 있으며, 기꺼이 위험을 감수해 가면서 옳다고 믿는 것을 추구하는 활동가일 수도 있다." },
          { id: 4, text: "They make us wonder: \"What could be the driving force behind them? What makes their lives meaningful to them and even to us?\"", trans: "이들을 보고 우리는 질문하게 된다. \"이 사람들 뒤에 있는 원동력은 과연 무엇일까? 어떻게 이들의 삶이 이들에게는 물론 우리에게까지 의미를 갖게 되는 걸까?\"" },
          { id: 5, text: "Let us meet two prominent individuals and try to answer these questions.", trans: "두 명의 유명한 사람들을 만나 이 질문들에 답해 보자.", isHighlight: true, logicPoint: 1 },

          // Luca "Lazylegz" Patuelli
          { id: 6, text: "Luca \"Lazylegz\" Patuelli", trans: "Luca \"Lazylegz\" Patuelli" },
          { id: 7, text: "\"Adapt, stay positive, and learn to do things your own way.\"", trans: "\"적응하고, 긍정적으로 생각하며, 자신만의 방식으로 해 내는 법을 배워라.\"" },
          { id: 8, text: "Luca \"Lazylegz\" Patuelli has lived by this motto his whole life.", trans: "Luca \"Lazylegz\" Patuelli는 이 좌우명에 따라 평생을 살아왔다." },
          { id: 9, text: "Born in 1984 with a rare disorder affecting the bones and joints of the body, he has undergone a total of 16 surgeries since he was 7 months old, to support his legs, hips, back, and shoulders.", trans: "1984년, 몸의 뼈와 관절에 영향을 미치는 희귀 장애를 갖고 태어나, 그는 생후 7개월부터 다리, 엉덩이, 등, 어깨를 지탱하기 위한 수술을 총 16회 받아 왔다." },
          { id: 10, text: "Despite the physical challenges, Lazylegz learned at an early age about the power of adapting positively to any situation.", trans: "신체적 어려움에도 불구하고, Lazylegz는 어린 나이에 어떤 상황에도 긍정적으로 적응하는 것의 힘에 대해 배웠다." },
          { id: 11, text: "Always eager to stay active and join his friends in any activity, he managed to participate in activities such as soccer, football, and baseball.", trans: "늘 활동적이고 어떤 활동이든 친구들과 함께하려는 열정으로, 그는 축구, 미식축구, 야구와 같은 활동에 참여할 수 있었다." },
          { id: 12, text: "He also succeeded in learning how to rock climb and ski, and he found ways to join his high school swim and dive teams.", trans: "그는 또한 암벽 등반을 하는 법과 스키 타는 법을 배우는 데 성공했고, 고등학교 수영과 다이빙 팀에 들어갈 방법을 찾아냈다." },
          { id: 13, text: "As he explored the full range of physical activities, skateboarding developed into a particular passion for him.", trans: "그가 폭넓은 범위의 신체 활동을 탐험하면서, 스케이트보딩에 특별한 열정을 가지게 되었다.", isHighlight: true, logicPoint: 2 },
          
          { id: 14, text: "In 1999, at the age of 15, Lazylegz was introduced to breakdancing.", trans: "1999년, 15세의 나이에 Lazylegz는 브레이크댄스를 접하게 되었다." },
          { id: 15, text: "Immediately, he was attracted to the music, the culture, and most of all, the challenging movements.", trans: "즉시 그는 음악, 문화, 그리고 무엇보다도 도전적인 동작들에 매료되었다." },
          { id: 16, text: "He slowly began creating a unique style that made the most of his upper body strength.", trans: "그는 천천히 상체 근력을 최대한 활용하는 독특한 스타일을 만들어 내기 시작했다." },
          { id: 17, text: "By using his crutches as extensions of his arms, Bboy Lazylegz was born!", trans: "목발을 팔의 연장선으로 사용함으로써 Bboy Lazylegz가 탄생했다!" },
          { id: 18, text: "As a professional dancer, he competed and performed in a wide variety of international dance events such as Breakin' Convention, World of Dance, and Hip Hop International.", trans: "프로 댄서로서, 그는 Breakin' Convention, World of Dance, Hip Hop International 등 다양한 국제 댄스 대회에서 경쟁하고 공연했다." },
          { id: 19, text: "He created ILL-Abilities in 2007, an international Bboy crew composed of some of the world's best dancers who are differently abled.", trans: "그는 2007년에 장애를 가졌지만 세계 최고 수준인 댄서들로 구성된 국제 비보이 크루인 ILL-Abilities를 만들었다." },
          { id: 20, text: "\"We have a message, and that message is No excuses, no limits. We want to encourage people of all abilities, all ages, and all races to pursue their passion, whatever it is. Find a way to do it your own way, and that's what it is all about.\"", trans: "\"우리에겐 메시지가 하나 있는데, 그 메시지는 '변명은 없다, 한계는 없다'입니다. 우리는 능력이 어떻든, 나이가 어떻든, 인종이 어떻든 간에, 사람들의 열정이 무엇이든지 그 열정을 추구하도록 격려하고 싶습니다. 자신만의 방식으로 할 방법을 찾으세요, 그게 전부입니다.\"" },
          
          { id: 21, text: "With dancing clearly part of his identity, Lazylegz wanted to see how far he could truly go.", trans: "춤이 자신의 정체성의 일부라는 확신과 함께, Lazylegz는 자신이 진정으로 어디까지 갈 수 있을지 보고 싶었다." },
          { id: 22, text: "In 2009, he graduated from Montreal's Concordia University with a degree in business.", trans: "2009년, 그는 몬트리올의 Concordia 대학교에서 경영학 학위로 졸업했다." },
          { id: 23, text: "Combining his passion for dance with his knowledge of engaging the masses, he has become a strong advocate for inclusion and integration, by bringing people of all abilities together through the power of dance.", trans: "춤에 대한 열정과 대중을 참여시키는 지식을 결합하여, 그는 춤의 힘을 통해 모든 능력의 사람들을 하나로 모음으로써 포용과 통합의 강력한 옹호자가 되었다." },
          { id: 24, text: "Just as his dancing reached a new peak in maturity and his message drew international attention, Lazylegz was given the honor of headlining the opening ceremony of the Vancouver 2010 Winter Paralympics.", trans: "그의 춤이 원숙함에 있어 새로운 정점에 도달하고 그의 메시지가 국제적인 관심을 끌었을 때, Lazylegz는 2010년 밴쿠버 동계 패럴림픽 개막식의 주연을 맡는 영예를 안았다." },
          { id: 25, text: "The past few years have been exciting for Luca \"Lazylegz\" Patuelli, and his dream of sharing the power of adaptation with the world continues to inspire others.", trans: "지난 몇 년은 Luca \"Lazylegz\" Patuelli에게 흥미진진한 시간이었으며, 적응의 힘을 세상과 나누고자 하는 그의 꿈은 계속해서 다른 이들에게 영감을 주고 있다." },
          { id: 26, text: "As a loving husband and devoted father, he is committed to helping his children grow up in a society where people of all abilities can come together and share their passions despite their differences.", trans: "사랑하는 남편이자 헌신적인 아버지로서, 그는 자신의 아이들이 서로의 다름에도 불구하고 모든 능력의 사람들이 모여 그들의 열정을 나눌 수 있는 사회에서 성장하도록 돕는 데 전념하고 있다.", isHighlight: true, logicPoint: 3 },

          // Lynsey Addario
          { id: 27, text: "Lynsey Addario", trans: "Lynsey Addario" },
          { id: 28, text: "\"Where in the world would I rather be than on the front line of history?\"", trans: "\"역사의 최전선이 아니라면 세상 어디에 내가 있고 싶겠는가?\"" },
          { id: 29, text: "Born in Connecticut, United States, in 1973, Lynsey Addario developed an early passion for photography.", trans: "1973년 미국 코네티컷에서 태어난 Lynsey Addario는 일찍부터 사진에 대한 열정을 키웠다." },
          { id: 30, text: "Her father gave her an old 35mm camera when she was about 12 years old.", trans: "그녀가 12살 정도였을 때 아버지는 그녀에게 낡은 35mm 카메라를 주셨다." },
          { id: 31, text: "She started reading books on how to take photographs.", trans: "그녀는 사진 찍는 법에 관한 책들을 읽기 시작했다." },
          { id: 32, text: "Too shy to approach people, she took pictures of flowers and the moon.", trans: "사람들에게 다가가기에는 너무 수줍음이 많아서, 그녀는 꽃과 달의 사진을 찍었다." },
          { id: 33, text: "Despite her love for taking pictures, she never learned photography formally.", trans: "사진 찍는 것에 대한 애정에도 불구하고, 그녀는 정식으로 사진을 배운 적이 없었다." },
          { id: 34, text: "Her parents taught her to appreciate diverse cultures and inquire about the world beyond her immediate surroundings.", trans: "그녀의 부모님은 그녀에게 다양한 문화를 가치 있게 여기고, 그녀를 바로 둘러싼 환경을 넘어선 세상에 대해 질문하도록 가르쳤다." },
          { id: 35, text: "She studied international relations and Italian at college.", trans: "그녀는 대학에서 국제 관계학과 이탈리아어를 공부했다." },
          { id: 36, text: "After graduation, she moved to Argentina to study Spanish, and it was there that she started working as a news photographer.", trans: "졸업 후, 그녀는 스페인어를 공부하기 위해 아르헨티나로 이주했고, 그곳에서 바로 보도 사진가로 일하기 시작했다.", isHighlight: true, logicPoint: 4 },

          { id: 37, text: "Addario's career took a significant turn when she went to Afghanistan in 2000.", trans: "Addario의 경력은 2000년에 아프가니스탄으로 가면서 중대한 전환점을 맞았다." },
          { id: 38, text: "Her photographs captured the grief, resilience, and courage of Afghan women.", trans: "그녀의 사진들은 아프가니스탄 여성들의 슬픔, 회복력, 그리고 용기를 포착했다." },
          { id: 39, text: "This body of work gained international recognition, serving as a stepping stone for Addario's future achievements.", trans: "이 작품들은 국제적인 인정을 받으며, Addario의 향후 성취를 위한 발판 역할을 했다." },
          { id: 40, text: "Over the years, Addario's work has taken her to many regions torn by war, including Iraq, Sudan, Libya, and Syria.", trans: "수년에 걸쳐, Addario의 작업은 이라크, 수단, 리비아, 시리아를 포함하여 전쟁으로 황폐해진 많은 지역으로 그녀를 이끌었다." },
          { id: 41, text: "She knows very well what could happen in the wars: she was captured twice and was even threatened with her life.", trans: "그녀는 전쟁에서 무슨 일이 일어날 수 있는지 아주 잘 안다. 그녀는 두 번이나 붙잡혔고 심지어 목숨의 위협을 받기도 했다." },
          { id: 42, text: "Time and again, however, she has risked her life to capture images that speak volumes about the suffering of those caught in the conflicts between nations.", trans: "하지만 거듭해서 그녀는 국가 간의 분쟁에 휘말린 사람들의 고통에 대해 많은 것을 시사하는 이미지를 포착하기 위해 목숨을 걸어왔다." },
          
          { id: 43, text: "\"The idea of me going to a war zone was out of the question. Then came 9/11, and it was such a defining moment in history that I felt like I needed to cover it.\"", trans: "\"제가 전쟁 지역에 간다는 것은 생각할 수도 없는 일이었어요. 그러다 9/11 테러가 일어났고, 그것은 역사상 너무나도 결정적인 순간이어서 제가 그것을 취재해야 한다는 느낌이 들었습니다.\"" },
          { id: 44, text: "\"From there I ended up covering the war in Iraq in 2003 because again, I felt like I needed to be there.\"", trans: "\"거기서부터 저는 결국 2003년 이라크 전쟁을 취재하게 되었는데, 왜냐하면 다시 한번, 제가 그곳에 있어야 한다고 느꼈기 때문입니다.\"" },
          { id: 45, text: "\"Young soldiers of my generation were going in to fight, and I thought it was important to document the war.\"", trans: "\"제 세대의 젊은 군인들이 싸우러 들어가고 있었고, 저는 전쟁을 기록하는 것이 중요하다고 생각했습니다.\"" },
          { id: 46, text: "\"I'm lucky because I've survived. I'm now at the point in my life and my career where many of my friends are not. And so I think it's important to realize there is a reason I'm still here, and I have to keep pushing forward.\"", trans: "\"저는 살아남았기 때문에 운이 좋습니다. 저는 지금 제 삶과 경력에서 제 많은 친구들이 있지 못한 지점에 있습니다. 그래서 제가 아직 여기에 있는 이유가 있다는 것을 깨닫는 것이 중요하다고 생각하며, 저는 계속 앞으로 나아가야 합니다.\"" },
          
          { id: 47, text: "Lynsey Addario has been capturing images that have defined the face of international conflicts and humanitarian crises.", trans: "Lynsey Addario는 국제 분쟁과 인도주의적 위기의 모습을 정의해 온 이미지들을 포착해 오고 있다." },
          { id: 48, text: "She has dedicated herself to throwing light not only on untold stories of individuals impacted by war, poverty, and social injustice, but also on touching moments of resilience and hope.", trans: "그녀는 전쟁, 빈곤, 사회적 불의에 영향받은 개인들의 아직 전해지지 않은 이야기뿐만 아니라 회복력과 희망의 감동적인 순간들을 조명하는 데 자신을 바쳐왔다." },
          { id: 49, text: "By capturing the essence of humanity in its raw and unfiltered forms, Addario continues her journey as one of the most influential and respected voices in the field of news photography.", trans: "그 날것의 여과되지 않은 형태로 인류애의 본질을 포착함으로써, Addario는 보도 사진 분야에서 가장 영향력 있고 존경받는 목소리 중 하나로서 그녀의 여정을 계속하고 있다.", isHighlight: true, logicPoint: 5 }
        ];

        const logicMapSteps = [
          { point: 1, title: "INTRODUCTION", desc: "한계를 극복하고 영감을 주는 두 인물 소개", color: "bg-slate-100 border-slate-400 text-slate-800", icon: <i className="ph-fill ph-users-three text-xl mb-2"></i> },
          { point: 2, title: "LAZYLEGZ (EARLY LIFE)", desc: "희귀 장애를 딛고 다양한 스포츠에 긍정적으로 적응", color: "bg-orange-100 border-orange-400 text-orange-800", icon: <i className="ph-fill ph-wheelchair text-xl mb-2"></i> },
          { point: 3, title: "LAZYLEGZ (BBOY)", desc: "목발을 활용한 비보이로 성공 및 통합의 옹호자", color: "bg-red-100 border-red-400 text-red-800", icon: <i className="ph-fill ph-hand-fist text-xl mb-2"></i> },
          { point: 4, title: "LYNSEY ADDARIO (START)", desc: "사진에 대한 열정과 독학, 종군 기자로서의 첫걸음", color: "bg-amber-100 border-amber-400 text-amber-800", icon: <i className="ph-fill ph-camera text-xl mb-2"></i> },
          { point: 5, title: "LYNSEY ADDARIO (CAREER)", desc: "위험을 무릅쓰고 전쟁의 참상과 희망을 기록하는 사명감", color: "bg-stone-200 border-stone-500 text-stone-800", icon: <i className="ph-fill ph-globe-hemisphere-east text-xl mb-2"></i> }
        ];

        function App() {
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [passwordInput, setPasswordInput] = useState("");
          const [loginError, setLoginError] = useState("");
          
          const CORRECT_PASSWORD = "Made by Lee";
          const itemRefs = useRef({});

          const handleLoginSubmit = (e) => {
            e.preventDefault();
            if (passwordInput === CORRECT_PASSWORD) {
              setIsAuthenticated(true);
              setLoginError("");
            } else {
              setLoginError("올바르지 않은 암호입니다. 다시 확인해 주세요.");
              setPasswordInput("");
            }
          };

          const [activeTab, setActiveTab] = useState('text');
          const [activeLogic, setActiveLogic] = useState(null);
          
          const handleLogicClick = (point) => {
              setActiveLogic(activeLogic === point ? null : point);
              setActiveTab('text'); 
          };

          useEffect(() => {
              if (activeTab === 'text' && activeLogic !== null) {
                  const targetItem = textData.find(item => item.logicPoint === activeLogic);
                  if (targetItem && itemRefs.current[targetItem.id]) {
                      setTimeout(() => {
                          itemRefs.current[targetItem.id].scrollIntoView({ behavior: 'smooth', block: 'center' });
                      }, 150);
                  }
              }
          }, [activeLogic, activeTab]);

          const [quiz1Answered, setQuiz1Answered] = useState(null);
          const [quiz2Answered, setQuiz2Answered] = useState(null);

          const handlePrint = () => { window.print(); };

          if (!isAuthenticated) {
            return (

                                                        ${quiz1Answered === null ? 'border-slate-200 hover:border-orange-400 hover:bg-orange-50' : 
                                                        (choice.isCorrect ? 'border-green-500 bg-green-50 text-green-800 shadow-sm' : 
                                                        (quiz1Answered === choice.id ? 'border-red-400 bg-red-50 text-red-600' : 'border-slate-100 text-slate-400 opacity-50'))}`}
                                                >
                                                    <span className="w-8 inline-block font-mono text-slate-500 print:text-black">{['①', '②', '③', '④'][choice.id - 1]}</span> {choice.text}
                                                </button>
                                            ))}
                                        </div>
                                        {quiz1Answered !== null && (
                                            <div className={`mt-4 p-4 rounded-lg text-sm leading-relaxed print:hidden ${quiz1Answered === 1 ? 'bg-green-50 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}`}>
                                                <p className="font-bold mb-1">{quiz1Answered === 1 ? '🎉 정답입니다!' : '오답입니다.'}</p>
                                                <p><strong>해설:</strong> 본문 11번 문장에서 Lazylegz는 신체적 어려움에도 불구하고 항상 활동적이기를 원하여 축구, 미식축구, 야구 등의 활동에 참여했다고(managed to participate in activities such as soccer...) 나와 있습니다[cite: 9].</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="border-t border-slate-200 pt-8 print:border-black print:pt-4">
                                        <div className="bg-slate-50 border border-slate-200 p-5 rounded-lg mb-4 print:bg-white print:border-none print:p-0 print:mb-4">
                                            <p className="font-bold text-slate-800 mb-2 print:text-black">Q2. 어법 판단</p>
                                            <p className="text-sm text-slate-600 mb-4 print:text-black">다음 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?</p>
                                            <p className="text-md leading-relaxed bg-white p-4 border border-slate-200 rounded print:border-slate-400 print:rounded-none print:text-black">
                                                (A) It almost appears as if they <strong>[ possess / possessed ]</strong> the ability to ignite their own spirits.<br/><br/>
                                                (B) We want to encourage people... to pursue their passion, <strong>[ whatever / however ]</strong> it is.<br/><br/>
                                                (C) She has dedicated herself to <strong>[ throw / throwing ]</strong> light not only on untold stories... but also on touching moments...
                                            </p>
                                        </div>
                                        <div className="space-y-2 print:space-y-3">
                                            {[
                                                { id: 1, text: "(A) possess —— (B) whatever —— (C) throw" },
                                                { id: 2, text: "(A) possessed —— (B) whatever —— (C) throwing", isCorrect: true },
                                                { id: 3, text: "(A) possessed —— (B) however —— (C) throwing" },
                                                { id: 4, text: "(A) possess —— (B) however —— (C) throw" }
                                            ].map((choice) => (
                                                <button key={choice.id} onClick={() => setQuiz2Answered(choice.id)} disabled={quiz2Answered !== null}
                                                    className={`w-full text-left p-4 rounded-lg border font-medium transition-all duration-200 print:border-none print:p-1 print:text-black
                                                        ${quiz2Answered === null ? 'border-slate-200 hover:border-orange-400 hover:bg-orange-50' : 
                                                        (choice.isCorrect ? 'border-green-500 bg-green-50 text-green-800 shadow-sm' : 
                                                        (quiz2Answered === choice.id ? 'border-red-400 bg-red-50 text-red-600' : 'border-slate-100 text-slate-400 opacity-50'))}`}
                                                >
                                                    <span className="w-8 inline-block font-mono text-slate-500 print:text-black">{['①', '②', '③', '④'][choice.id - 1]}</span> {choice.text}
                                                </button>
                                            ))}
                                        </div>
                                        {quiz2Answered !== null && (
                                            <div className={`mt-4 p-4 rounded-lg text-sm leading-relaxed print:hidden ${quiz2Answered === 2 ? 'bg-green-50 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}`}>
                                                <p className="font-bold mb-1">{quiz2Answered === 2 ? '🎉 정답입니다!' : '오답입니다.'}</p>
                                                <p><strong>해설:</strong><br/>
                                                (A) '마치 ~인 것처럼'이라는 현재 사실의 반대를 가정하는 as if 가정법 과거이므로 과거동사 possessed가 적절합니다.<br/>
                                                (B) '그 열정이 무엇이든지'라는 의미의 복합관계대명사 whatever가 명사절 보어를 이끕니다.<br/>
                                                (C) 'dedicate oneself to(전치사) ~ing' 구조이므로 동명사 throwing이 와야 합니다[cite: 9].
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </main>

                <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-2 pb-safe z-30 shadow-[0_-5px_10px_rgba(0,0,0,0.05)] print:hidden">
                    <button onClick={() => setActiveTab('text')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'text' ? 'text-orange-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'text' ? 'ph-fill' : 'ph'} ph-book-open text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">지문 분석</span>
                    </button>
                    <button onClick={() => setActiveTab('syntax')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'syntax' ? 'text-orange-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'syntax' ? 'ph-fill' : 'ph'} ph-highlighter-circle text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">핵심 구문</span>
                    </button>
                    <button onClick={() => setActiveTab('map')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'map' ? 'text-orange-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'map' ? 'ph-fill' : 'ph'} ph-git-merge text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">논리 구조도</span>
                    </button>
                    <button onClick={() => setActiveTab('quiz')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'quiz' ? 'text-orange-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'quiz' ? 'ph-fill' : 'ph'} ph-check-square-offset text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">실전 문제</span>
                    </button>
                </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
