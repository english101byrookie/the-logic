    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const textData = [
          // Intro: Jiyun's Day
          { id: 1, text: "Jiyun, a high school student, starts her day by logging in to a music streaming service on her smartphone.", trans: "고등학생인 지윤이는 그녀의 스마트폰에서 음악 스트리밍 서비스에 로그인하며 하루를 시작한다." },
          { id: 2, text: "She enjoys listening to her favorite music, discovering new songs, and exploring new artists every day.", trans: "그녀는 매일 자신이 선호하는 음악을 듣고, 새로운 노래들을 발견하고, 새로운 아티스트들을 탐색하는 것을 즐긴다." },
          { id: 3, text: "For a healthy breakfast, Jiyun receives a delivery from a subscription service that provides fresh vegetables and fruits.", trans: "건강한 아침 식사를 위해, 지윤이는 신선한 채소와 과일을 공급하는 구독 서비스로부터 배송을 받는다." },
          { id: 4, text: "After school, Jiyun utilizes a video lecture service to expand her knowledge in whatever she finds interesting.", trans: "방과 후에, 지윤이는 그녀가 흥미를 느끼는 것마다 그녀의 지식을 확장하기 위해 비디오 강의 서비스를 활용한다." },
          { id: 5, text: "For example, she watches various academic lectures to review her schoolwork and stay updated about the latest knowledge in her chosen field of study.", trans: "예를 들어, 그녀는 학교 공부를 복습하고 그녀가 선택한 연구 분야의 최신 지식에 대해 계속 업데이트하기 위해 다양한 학술 강의를 시청한다." },
          { id: 6, text: "During weekends, Jiyun and her family spend quality time together watching movies or dramas using a streaming service.", trans: "주말에 지윤이와 그녀의 가족은 스트리밍 서비스를 사용하면서 함께 영화나 드라마를 시청하는 좋은 시간을 보낸다." },

          // Subscriptions are everywhere
          { id: 7, text: "Subscriptions are everywhere", trans: "구독은 모든 곳에 있다" },
          { id: 8, text: "To be sure, the subscription economy is a popular economic model nowadays, and Jiyun is actively taking part in it.", trans: "분명히, 구독 경제는 요즈음 인기 있는 경제 모델이고, 지윤이는 그것에 적극적으로 참여하고 있다." },
          { id: 9, text: "The concept of business models based on subscriptions is not new. Initially it was limited to products such as milk and newspapers.", trans: "구독 기반의 비즈니스 모델의 개념은 새로운 것이 아니다. 처음에 그것은 우유와 신문 같은 제품들에 한정되었다." },
          { id: 10, text: "However, these business models have expanded to all industries, including entertainment, technology, fashion, education, and much more.", trans: "하지만, 이들 사업 모델은 엔터테인먼트, 기술, 패션, 교육, 그리고 훨씬 더 많은 것들을 포함한, 모든 산업들로 확산되었다." },
          { id: 11, text: "Instead of creating a hit product that will be sold once, companies now prioritize providing continuing value, such as new content, more personalization, or access to updates.", trans: "일회성으로 팔릴 히트 상품을 창출하는 대신에, 기업들은 지금 새 콘텐츠, 보다 개인 맞춤형, 또는 업데이트 접근성 같은 지속적 가치를 제공하는 것을 우선시한다." },
          { id: 12, text: "Customers pay for these benefits via a regular subscription.", trans: "고객들은 정기적 구독을 통해 이러한 혜택들에 대해 비용을 지불한다.", isHighlight: true, logicPoint: 1 },
          { id: 13, text: "The subscription economy brings advantages for both companies and consumers.", trans: "구독 경제는 기업과 소비자 모두에게 이점을 가져다준다." },
          { id: 14, text: "Companies can have a stable revenue and build customer loyalty by using the subscription model.", trans: "기업들은 구독 모델을 사용해서 안정적인 수입을 얻고 고객 충성도를 구축할 수 있다." },
          { id: 15, text: "From the consumers' perspective, they can enjoy a wider range of choices and personalized experiences. They can also save money by having flexible subscription contracts.", trans: "소비자의 관점에서, 그들은 더욱 다양한 범위의 선택과 개인 맞춤형 경험을 즐길 수 있다. 그들은 또한 융통성 있는 구독 계약을 함으로써 돈을 절약할 수 있다." },
          { id: 16, text: "The rise of the subscription economy is closely connected to two major drivers: changes in consumption trends and the rapid growth of online platforms.", trans: "구독 경제의 부상은 두 개의 주요한 동인들과 깊은 연관이 있다. 소비 추세의 변화들과 온라인 플랫폼의 급성장." },

          // People love the subscriptions
          { id: 17, text: "People love the subscriptions", trans: "사람들은 구독을 사랑한다" },
          { id: 18, text: "The subscription economy is highly relevant to how people consume goods and services nowadays.", trans: "구독 경제는 요즘 사람들이 어떻게 재화와 서비스를 소비하는지와 상당히 관련되어 있다." },
          { id: 19, text: "More and more people prioritize experiences over owning things.", trans: "점점 더 많은 사람이 물건을 소유하는 것보다 경험을 우선시한다." },
          { id: 20, text: "This makes the subscription economy attractive to them because it offers access to services or content without the requirement of ownership.", trans: "이것이 구독 경제를 그들에게 매력적인 것으로 만드는데 왜냐하면 그것은 소유의 필요 없이 서비스나 콘텐츠에 대한 접근을 제공하기 때문이다." },
          { id: 21, text: "For example, by subscribing to a music streaming service, consumers can enjoy limitless music without the need for having disc albums.", trans: "예를 들어, 음악 스트리밍 서비스를 구독함으로써, 소비자들은 디스크 앨범을 가질 필요가 없이 무한한 음악을 즐길 수 있다." },
          { id: 22, text: "Another example is subscribing to clothing services, where consumers can explore a variety of clothing styles without filling up their drawers.", trans: "또 다른 예는 의류 서비스를 구독하는 것으로, 소비자들은 그들의 서랍을 채우지 않고 다양한 의류 스타일을 탐색할 수 있다.", isHighlight: true, logicPoint: 2 },
          { id: 23, text: "Moreover, consumers value diversity and customization.", trans: "게다가, 소비자들은 다양성과 맞춤화에 가치를 둔다." },
          { id: 24, text: "The subscription economy offers a diverse range of subscription options, enabling individuals to personalize their experiences based on their own preferences and interests.", trans: "구독 경제는 다양한 범위의 구독 선택을 제공하여, 개인들이 그들의 선호와 관심에 기초하여 그들의 경험들을 개별화할 수 있도록 해 준다." },
          { id: 25, text: "This aspect of the subscription economy is more popular among younger generations, as they enjoy expressing their uniqueness and discovering valuable content and services that fit with their individual tastes.", trans: "구독 경제의 이러한 측면은 젊은 세대가 그들의 고유함을 표현하고, 젊은 세대의 개별적 취향에 부합하는 가치 있는 콘텐츠와 서비스들을 발견하는 것을 즐김에 따라, 젊은 세대 사이에 더욱 인기가 있다." },
          { id: 26, text: "A popular example that has gained attention is the cosmetics subscription service.", trans: "주목받고 있는 인기 사례는 화장품 구독 서비스이다." },
          { id: 27, text: "It stands out by thoroughly analyzing customers' current skin conditions and providing specialized recommendations, including manufacturing cosmetics created to address each individual's unique skin concerns.", trans: "그것은 소비자의 현재 피부 상태를 철저하게 분석하고 개개인의 고유한 피부 고민을 해결하기 위해 만들어진 화장품 제조를 포함한 전문적인 추천을 제공하는 것이 돋보인다." },
          { id: 28, text: "To come to the point, consumers receive a personalized experience that prioritizes their individual skin conditions, rather than a uniform purchasing process.", trans: "요점을 말하자면, 소비자들은 획일화된 구매 과정 대신에, 그들 개인의 피부 조건을 우선시하는 개별화된 경험을 얻는다." },
          { id: 29, text: "Furthermore, consumers appreciate flexibility and convenience.", trans: "게다가, 소비자들은 유연성과 편의성을 높이 평가한다." },
          { id: 30, text: "In some subscription models, consumers can experience a variety of products or services for a fixed cost.", trans: "일부 구독 모델에서는, 소비자들이 고정된 비용으로 다양한 제품과 서비스를 경험할 수 있다." },
          { id: 31, text: "In other models, they can flexibly adjust subscription fees by choosing only the necessary services or products when needed.", trans: "다른 모델에서는, 필요할 때 필요한 서비스나 제품만 선택하여 구독 요금을 유연하게 조정할 수 있다." },
          { id: 32, text: "This means they can either enjoy a range of offerings for a set price or save money by selecting only what they really need.", trans: "이것은 정해진 가격으로 다양한 제공을 즐길 수도 있고, 그들이 실제 필요한 것만 선택함으로써 돈을 절약할 수도 있음을 의미한다.", isHighlight: true, logicPoint: 3 },
          { id: 33, text: "Moreover, subscription services are made easily accessible by online platforms, enhancing consumers' convenience.", trans: "게다가, 구독 서비스는 온라인 플랫폼을 통해 쉽게 접근할 수 있게 되어 소비자들의 편의를 증진시킨다." },
          { id: 34, text: "With just a few clicks, consumers can receive services or products. If they wish to change their device model, they can do so.", trans: "단지 몇 번의 클릭으로, 소비자들은 서비스나 제품을 받을 수 있다. 만약 그들이 그들의 기기 모델을 변경하기를 원하면, 그렇게 할 수 있다." },
          { id: 35, text: "Whoever desires an upgrade can get it and experience the latest models.", trans: "업그레이드를 원하는 사람들은 누구든지 받을 수 있고 최신 모델을 경험할 수 있다." },

          // Online platforms drive the subscription economy
          { id: 36, text: "Online platforms drive the subscription economy", trans: "온라인 플랫폼들이 구독 경제를 구동한다" },
          { id: 37, text: "With the development of various digital devices centered on smartphones, consumers have been able to do numerous things with great ease.", trans: "스마트폰을 중심으로 한 다양한 디지털 기기의 발전과 함께 소비자들은 많은 것들을 아주 쉽게 할 수 있게 되었다." },
          { id: 38, text: "In the past, people had no choice but to go to the theater or purchase the videos they wanted to watch.", trans: "과거에는, 사람들이 영화관에 가거나, 그들이 시청하기 원하는 비디오들을 구매할 수밖에 없었다." },
          { id: 39, text: "Today, whoever wants to watch a movie can access online media subscription platforms and enjoy a vast selection of movies on their smartphones or other digital devices.", trans: "오늘날에는, 영화 시청을 원하는 사람들은 누구나 온라인 미디어 구독 플랫폼에 접속해서 그들의 스마트폰에서 또는 다른 디지털 기기에서 엄청난 양의 영화를 즐길 수 있다." },
          { id: 40, text: "At the same time, these platforms make it easy for companies to offer customized products and services to customers.", trans: "동시에, 이들 플랫폼들은 기업들이 고객들에게 맞춤형 제품과 서비스를 제공하는 것을 쉽게 만든다." },
          { id: 41, text: "By applying AI and big data algorithm technology, companies identify consumers' needs, tastes, and consumption patterns.", trans: "인공지능과 빅데이터 알고리즘 기술을 적용하여, 기업들은 고객들의 요구, 기호, 소비 패턴들을 확인한다." },
          { id: 42, text: "People appreciate having diverse choices and customization, which in turn enhances their satisfaction.", trans: "사람들은 다양한 선택과 맞춤화를 환영하며 이는 결과적으로 그들의 만족을 증진시킨다." },
          { id: 43, text: "Services, such as suggesting personalized clothing styles based on customers' purchase history or recommending videos that match their movie and video viewing history, bring them great satisfaction.", trans: "소비자의 구매 기록에 기반한 개인 맞춤화된 의류 스타일 제안이나, 그들의 영화 및 비디오 시청 기록과 부합하는 비디오 추천과 같은 서비스는 그들에게 커다란 만족을 가져다준다." },

          // Limitations of the subscription economy
          { id: 44, text: "Limitations of the subscription economy", trans: "구독 경제의 제한점들" },
          { id: 45, text: "Although the subscription economy offers many advantages, there are also some disadvantages to consider.", trans: "비록 구독 경제가 많은 장점을 제공하지만, 또한 고려해야 할 일부 단점들도 있다." },
          { id: 46, text: "One concern is the potential for overconsumption.", trans: "한 가지 우려 사항은 과소비 가능성이다." },
          { id: 47, text: "The convenience and accessibility of the subscription model make it easy for consumers to sign up for multiple services and use a lot of content or products.", trans: "구독 모델의 편리성과 접근성은 소비자들이 복수의 서비스를 계약하고 많은 콘텐츠나 제품을 사용하는 것을 쉽게 만든다." },
          { id: 48, text: "This can result in excessive consumption and using more subscription services than actually needed.", trans: "이것은 과도한 소비와 실제로 필요한 것보다 많은 구독 서비스 사용을 야기할 수 있다." },
          { id: 49, text: "It is crucial to subscribe only to services that are truly necessary and avoid subscribing to similar services.", trans: "진정으로 필요한 서비스들만 구독하고 유사한 서비스들을 구독하는 것을 피하는 것이 매우 중요하다.", isHighlight: true, logicPoint: 4 },
          { id: 50, text: "Related to the concern of overconsumption is the financial burden that subscriptions can create.", trans: "과소비의 우려와 관련된 것으로 구독이 창출할 수 있는 금융 부담이 있다." },
          { id: 51, text: "While the cost of individual subscriptions may seem affordable, subscribing to multiple services can add up quickly.", trans: "개별 구독 비용은 감당할 수 있어 보일 수 있지만, 복수의 서비스를 구독하는 것은 비용이 빠르게 증가할 수 있다." },
          { id: 52, text: "It is important to carefully consider the costs of these subscriptions to avoid financial strain.", trans: "재정적 부담을 피하기 위해 이들 구독의 비용을 신중하게 고려하는 것이 중요하다." },
          { id: 53, text: "Regularly reviewing and canceling unnecessary subscriptions can be beneficial.", trans: "정기적으로 검토하고 불필요한 구독들을 취소하는 것이 유익할 수 있다." },
          { id: 54, text: "Additionally, the subscription economy can contribute to environmental pollution.", trans: "부가적으로, 구독 경제는 환경 오염에 기여할 수 있다." },
          { id: 55, text: "The regular delivery of products in packaging materials can increase the use of disposable packaging, which harms the environment.", trans: "포장재에 담긴 제품들을 정기적으로 배달하는 것은 일회용 포장의 사용을 증가시킬 수 있어 이것이 환경을 해친다." },
          { id: 56, text: "Using environmentally friendly packaging materials and opting for reusable packaging can help reduce this problem.", trans: "친환경 포장 재료를 사용하고 재사용 가능한 포장을 선택하는 것은 이 문제를 줄이는 데 도움이 될 수 있다." },
          
          // Conclusion
          { id: 57, text: "Despite the potential limitations of subscription services, they have become deeply embedded in our lives and more and more businesses are jumping onto the subscription economy model.", trans: "구독 서비스들의 잠재적 제한점들에도 불구하고, 그것은 우리의 삶에 깊숙이 자리 잡고 있으며 더욱더 많은 사업이 구독 경제 모델에 올라타고 있다." },
          { id: 58, text: "It is expected that new subscription services will be continuously provided to consumers in new areas in the future.", trans: "미래에 새로운 영역들에서 소비자들에게 새로운 구독 서비스들이 지속적으로 제공될 것으로 예상된다." },
          { id: 59, text: "We need to have a deeper understanding of the subscription economy and become wise consumers who receive the services that are really needed.", trans: "우리는 구독 경제에 대해 보다 깊은 이해를 가지고 정말 필요한 서비스들만 받는 현명한 소비자가 되어야 한다.", isHighlight: true, logicPoint: 5 }
        ];

        const logicMapSteps = [
          { point: 1, title: "INTRODUCTION", desc: "모든 산업으로 확산된 구독 경제의 일상화", color: "bg-slate-100 border-slate-400 text-slate-800", icon: <i className="ph-fill ph-repeat text-xl mb-2"></i> },

                                                (C) 보어(Related ~)가 문두로 나가 주어와 동사가 도치된 구문이므로 과거분사형인 Related가 적절합니다[cite: 8].
