<body class="app-like bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const textData = [
          // Intro
          { id: 1, text: "Imagine an urban area that is fast becoming a slum after an economic recession.", trans: "경기 침체 후 빠르게 슬럼가로 변해가는 어느 도시 지역을 상상해 보라." },
          { id: 2, text: "Businesses close their doors and building owners have left. The area is full of abandoned buildings. There is no heating even in winter.", trans: "기업들은 문을 닫고 건물 주인들은 떠나버렸다. 이 지역은 버려진 건물들로 가득 차 있다. 겨울에도 난방이 되지 않는다." },
          { id: 3, text: "Only those who can't afford to move out remain.", trans: "이사 갈 여력이 없는 사람들만 남는다." },
          { id: 4, text: "Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner.", trans: "실업률은 높고, 갱단이 많이 생겨나고, 젊은이들 사이의 갱단 폭력은 일상이 된다. 거리 구석구석마다 절망이 있다." },
          { id: 5, text: "One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community.", trans: "그러나 어느 날, 무료 급식과 의료 프로그램으로 존경받는 Ghetto Brothers라는 한 갱단이 싸움을 멈추고 대신 젊은이들이 단결하여 더 나은 공동체를 만들자고 설득하기로 결정한다." },
          { id: 6, text: "They suggest a peace treaty. \"This is for peace, men. The violence took away our brothers. We're not gangsters anymore. We've got to make this town a better place to live.\"", trans: "그들은 평화 협정을 제안한다. \"이건 평화를 위한 겁니다. 여러분, 폭력이 우리 형제들을 앗아갔죠. 더 이상 우린 갱단의 일원이 아닙니다. 우린 이 마을을 더 살기 좋은 곳으로 만들어야 해요.\"" },
          { id: 7, text: "Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes.", trans: "이 새로운 목소리에 힘입어 지역 전역의 갱단 대표들이 협정에 서명한다. 그들은 결코 다시는 분쟁 해결에 폭력을 사용하지 않을 것이다.", isHighlight: true, logicPoint: 1 },
          { id: 8, text: "This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants.", trans: "이것이 1970년대 초 뉴욕의 브롱스인데, 이곳에서 힙합 음악은 아프리카계 미국인들과 이민자들이 창조한 새로운 평화 문화의 한 주축으로서 탄생하였다." },
          { id: 9, text: "The story of hip-hop, now one of the world's most dominant music genres, is a fascinating one. Let's explore it.", trans: "현재 세계에서 가장 지배적인 음악 장르의 하나인 힙합의 이야기는 매혹적이다. 그 이야기를 탐구해 보자." },

          // DJing, Breakdancing, and MCing
          { id: 10, text: "DJing, Breakdancing, and MCing", trans: "디제잉, 브레이크댄스, 엠씨잉" },
          { id: 11, text: "After the peace treaty, the gangs that had fought one another started partying together.", trans: "평화 협정 후, 서로 싸웠었던 갱들이 함께 파티를 벌이기 시작했다." },
          { id: 12, text: "Abandoned buildings and parking lots were used for events called block parties.", trans: "버려진 건물과 주차장들이 블록 파티라는 행사에 사용되었다." },
          { id: 13, text: "What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti.", trans: "이 파티들에서 결국 무엇이 출현했는가? 디제잉, 브레이크댄스, 엠씨잉, 그래피티를 기반으로 한, 힙합 문화라고 불리는 활기찬 청년 운동이다." },
          { id: 14, text: "It replaced gang violence with music, dance, art, and style.", trans: "이 운동은 갱단 폭력을 음악, 춤, 예술, 스타일로 대체했다." },
          { id: 15, text: "The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop.", trans: "가장 인기 있는 블록 파티는 디제이 Kool Herc가 주최한 파티였고, 그는 힙합의 창시자로 간주된다." },
          { id: 16, text: "Herc's party for his sister's birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique.", trans: "1973년 8월 Herc의 여동생 생일 파티는 Herc가 사용한 새로운 디제이 테크닉 때문에 지금은 힙합 음악의 발생지로 알려져 있다." },
          { id: 17, text: "At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break.", trans: "Herc는 이 파티에서 두 개의 턴테이블을 동시에 사용하여 동일한 레코드판 두 개를 재생한 다음, 브레이크라는 드럼 연주 구간을 연장시키기 위해 두 레코드판을 번갈아 다루었다." },
          { id: 18, text: "No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc.", trans: "사람들은 더 이상 레코드판이 다 돌아간 후 디제이가 LP 디스크를 교체하는 동안 춤을 멈출 필요가 없어졌다." },
          { id: 19, text: "Kool Herc's style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", trans: "Kool Herc의 디제잉 스타일은 힙합 음악과 브레이크댄스의 부상에 빠르게 영향을 미쳤다." },
          { id: 20, text: "The break section became the most anticipated part of a song.", trans: "브레이크 구간은 노래에서 가장 기대되는 부분이 되었다." },
          { id: 21, text: "People would form dancer circles and use the break to show off their individual dancing skills.", trans: "사람들은 춤꾼들의 원을 만들어 브레이크를 이용해 각자의 춤 실력을 뽐내곤 했다." },
          { id: 22, text: "Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break-Girls.", trans: "Kool Herc는 자신의 음악에 맞추어 춤추는 사람들을 브레이크 보이와 브레이크 걸의 줄임말로 비보이와 비걸이라고 불렀다." },
          { id: 23, text: "These people began to dance in groups in the streets and build a street dance battle culture.", trans: "이들은 거리에서 무리 지어 춤을 추면서 거리의 댄스 경연 문화를 구축하기 시작했다." },
          { id: 24, text: "DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like \"To the beat\" and \"You don't stop!\"", trans: "Kool Herc와 같은 디제이들은 관중의 흥을 돋우기 위해 노래의 악기 연주 구간 동안 박자와 라임을 넣은 말을 했다. 그들은 \"리듬에 맞춰\"와 \"멈추지 마!\"와 같은 문구들을 소리치곤 했다." },
          { id: 25, text: "This was the beginning of rapping or MCing.", trans: "이것이 랩, 즉 엠씨잉의 시작이었다." },
          { id: 26, text: "When DJs couldn't do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties.", trans: "디제이들은 자신이 디제잉과 리듬감 있는 외침을 동시에 할 수가 없을 때, 친구에게 파티에서 청중에게 말하는 역할 즉 사회자 곧 엠씨의 역할을 부탁했다." },
          { id: 27, text: "This separate role became MCing.", trans: "이 별도의 역할이 엠씨잉이 된 것이다.", isHighlight: true, logicPoint: 2 },

          // The Origin of the Word Hip-Hop
          { id: 28, text: "The Origin of the Word Hip-Hop", trans: "힙합이라는 말의 기원" },
          { id: 29, text: "Then where did the word hip-hop originate from?", trans: "그러면 힙합이라는 말은 어디에서 유래한 걸까?" },
          { id: 30, text: "Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party.", trans: "정확한 유래는 아무도 모르지만, 힙합이라는 단어는 어느 블록 파티에서 처음 사용되었다고 한다." },
          { id: 31, text: "A young man at the party was about to join the army.", trans: "파티에 참석한 한 청년이 곧 군대에 입대할 예정이었다." },
          { id: 32, text: "His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, \"Hip-hop-hip-hop-hip-hop.\"", trans: "그의 좋은 친구이자 그 파티의 엠씨가 군 교관처럼 박자에 맞춰 무대를 가로질러 움직이면서 \"힙합 힙합 힙합\"을 외침으로써 그 청년에게 자유의 시절이 끝났음을 장난스레 상기시켰다." },
          { id: 33, text: "The crowd loved it. After that, MCs tried out new lines at parties like \"Hip, hop, hippy to the hippy hop-bop,\" \"I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don't stop.\"", trans: "청중들은 그것을 좋아했다. 그 후 엠씨들은 파티에서 \"힙, 합, 히피 투더 히피 합밥\", \"내가 말했지 힙합이라고, 힙빗, 힙비딥비, 힙힙합이라고, 그럼 너도 멈추지 마\"와 같은 새로운 대사를 시도했다." },
          { id: 34, text: "Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper's Delight (1979), which was an immediate success.", trans: "그러한 대사들은 랩의 표준적인 부분이 되었으며, 최초의 힙합 앨범 <Rapper's Delight(래퍼의 기쁨)> (1979)에서 가사의 일부로 들어갔고, 이 앨범은 즉각적인 성공을 거두었다.", isHighlight: true, logicPoint: 3 },
          { id: 35, text: "The new music and dancing spread very fast.", trans: "새로운 음악과 춤은 매우 빠르게 퍼져나갔다." },
          { id: 36, text: "There was a sharp unexplained decline in violence during the 1980s in New York.", trans: "1980년대 뉴욕에서는 설명할 수 없는 급격한 폭력 사건 감소가 있었다." },
          { id: 37, text: "One police officer asked a boy on the street if he knew why. The boy said, \"It's because they're dancing.\"", trans: "한 경찰관은 거리에 있는 한 소년에게 이유를 아냐고 물었다. 그 소년은 \"그건 그들이 춤추고 있기 때문이죠\"라고 말했다." },

          // The Messages of Hip-Hop
          { id: 38, text: "The Messages of Hip-Hop", trans: "힙합의 메시지" },
          { id: 39, text: "Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper.", trans: "초기 힙합의 파티 구호로 출발한 랩 가사는 일반적으로 다 함께 즐거운 시간을 갖자는 내용과 디제이나 래퍼의 능력을 뽐내는 내용에 초점을 두었다." },
          { id: 40, text: "However, a significant shift occurred during the rise of hip-hop music in the 1980s.", trans: "그러나 1980년대 힙합 음악의 부상 시기에 중요한 변화가 일어났다." },
          { id: 41, text: "Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking.", trans: "가장 중요한 것은, 1982년 그룹 Grandmaster Flash and Furious Five의 노래 <The Message(메시지)>의 등장이 획기적이었다는 점이다." },
          { id: 42, text: "This song's powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen.", trans: "이 노래의 강력한 가사는 게토에서 태어나 이등 시민으로 살다가 죽어야 했던 소년의 슬픈 이야기를 포함하여 게토에서의 삶의 가혹한 현실을 자세히 묘사했다." },
          { id: 43, text: "With this song, hip-hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice.", trans: "파티를 통해 평화를 창조하는 것이 본래 목표였던 힙합은 이 노래를 통해 불의에 저항하는 새로운 사회 비판의 전통을 시작했다." },
          { id: 44, text: "The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s.", trans: "<The Message>는 역사상 가장 영향력 있는 랩 싱글 중 하나가 되었고, 1980년대와 1990년대에 인종 차별에 맞서는 많은 힙합 노래가 뒤를 이었다." },
          { id: 45, text: "At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", trans: "그와 동시에, 리듬감 있는 박자와 랩이 어우러진 그들의 음악은 사람들을 움직이게 하고 춤추게 만들었다. 사람들은 비트에 맞춰 몸을 움직이면서 사회적 메시지를 들었다." },
          { id: 46, text: "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as \"respect.\"", trans: "또한 힙합 가사에 점차 새로운 태도가 나타났는데 그것은 '존경'으로 요약될 수 있다.", isHighlight: true, logicPoint: 4 },
          { id: 47, text: "Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers.", trans: "힙합 음악은 서로에 대한 존경, 특히 힙합의 선구자들에 대한 존경을 표현하는 한 방법이 되기 시작했다." },
          { id: 48, text: "For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture.", trans: "래퍼들에게 그 선구자들은 고난과 불의를 딛고 계속 나아가 새로운 음악과 문화를 창조해 낸 영웅들이다." },
          { id: 49, text: "Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes.", trans: "그러므로 많은 힙합인들은 자신들이 이 영웅들에게 아무리 큰 존경심을 가져도 지나치지 않다는 데 동의한다." },
          { id: 50, text: "The phrase \"something from nothing,\" often used to summarize the genre's history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources.", trans: "힙합 장르의 역사를 요약할 때 자주 사용되는 '무에서 유를'이라는 어구 또한, 매우 제한된 자원에도 불구하고 게토에서 새로운 문화를 일구어낸 초기 힙합인들에 대한 존경의 표현이기도 하다." },
          { id: 51, text: "Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers.", trans: "래퍼들은 또한 그들 자신도, 어쩌면 청중들도, 그 선구자들과 비슷하게 고통을 겪고 살아남았다는 느낌을 자랑스럽게 표현했다." },
          { id: 52, text: "This is why the message of respect is about both self-worth and respect for others.", trans: "그렇기 때문에 존경의 메시지는 자존감 그리고 타인에 대한 존경 둘 다에 관한 것이다." },
          { id: 53, text: "The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", trans: "힙합에서 존경이라는 개념의 중요성은 아무리 강하게 강조해도 지나치지 않다." },

          // Hip-Hop in the 21st Century
          { id: 54, text: "Hip-Hop in the 21st Century", trans: "21세기 힙합" },
          { id: 55, text: "\"The HipHop Declaration of Peace,\" presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace.", trans: "2001년 5월 16일 유엔에 제출된 '힙합 평화 선언문'은 힙합을 국제적인 평화 문화로 공식 인정했다." },
          { id: 56, text: "This document reminds us of hip-hop's original mission to bring peace to the Bronx, implying global respect for hip-hop history.", trans: "이 문서는 브롱스에 평화를 가져오려 한 힙합 원래의 사명을 우리에게 상기시키고 힙합 역사에 대한 전 세계적인 존중을 암시한다." },
          { id: 57, text: "When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event.", trans: "힙합 아티스트 Kendrick Lamar가 2018년 퓰리처 음악상을 수상했을 때, 그것은 또 하나의 중요한 사건이었다." },

                                    </div>

                                    <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm print:border-black print:rounded-none print:shadow-none md:col-span-2">
                                        <div className="bg-violet-600 text-white font-bold px-4 py-2 print:bg-slate-200 print:text-black print:border-b print:border-black">
                                            POINT 04. 계속적 용법의 관계대명사
                                        </div>
                                        <div className="p-4 bg-white">
                                            <p className="text-sm text-slate-500 mb-2 italic print:text-black">"[58] It meant that hip-hop<span className="font-bold text-violet-700">, which</span> started as underground music<span className="font-bold text-violet-700">,</span> had become a major art form..."</p>
                                            <p className="text-slate-700 leading-relaxed print:text-black">
                                                콤마(,) 뒤에 오는 <strong className="text-violet-800 print:text-black">which</strong>는 선행사 hip-hop에 대한 추가적인 설명을 제공하는 계속적 용법의 주격 관계대명사입니다. 힙합이 주류 예술로 자리 잡기 전에 언더그라운드에서 시작되었다는 배경 설명을 더해줍니다[cite: 7].
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* ================= SECTION 3 ================= */}
                        <section className={`print-show-all ${activeTab === 'map' ? 'block animate-fade-in' : 'hidden print:block print-page-break'}`}>
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 print:shadow-none print:border-none print:p-0">
                                <h2 className="text-2xl font-bold text-blue-900 border-b-2 border-blue-100 pb-3 mb-8 flex items-center gap-2 print:text-black print:border-black">
                                    <i className="ph-fill ph-git-merge text-blue-600 print:text-black"></i> PART 3. Logic Map
                                </h2>
                                
                                <div className="flex flex-col items-center gap-2 py-4">
                                    {logicMapSteps.map((step, idx) => (
                                        <React.Fragment key={step.point}>
                                            <div onClick={() => handleLogicClick(step.point)} className={`w-full max-w-md border-2 rounded-xl p-5 flex flex-col items-center text-center bg-white cursor-pointer hover:shadow-md transition-shadow print:border-slate-800 print:rounded-none print:text-black ${activeLogic === step.point ? 'ring-4 ring-blue-300 scale-105 transition-transform' : ''} ${step.color}`}>
                                                <div className="print:hidden">{step.icon}</div>
                                                <span className="font-bold text-base mb-1 print:text-black">{step.title}</span>
                                                <span className="text-sm font-medium opacity-90 print:text-black">{step.desc}</span>
                                                <span className="text-[10px] mt-2 opacity-50 print:hidden">(클릭하여 본문 확인)</span>
                                            </div>
                                            
                                            {idx < logicMapSteps.length - 1 && (
                                                <div className="flex flex-col items-center">
                                                    <div className="w-0.5 h-8 bg-slate-300 print:bg-slate-800"></div>
                                                    <i className="ph-bold ph-arrow-down text-lg text-slate-400 print:text-slate-800"></i>
                                                </div>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* ================= SECTION 4 ================= */}
                        <section className={`print-show-all ${activeTab === 'quiz' ? 'block animate-fade-in' : 'hidden print:block'}`}>
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 print:shadow-none print:border-none print:p-0">
                                <h2 className="text-2xl font-bold text-blue-900 border-b-2 border-blue-100 pb-3 mb-6 flex items-center gap-2 print:text-black print:border-black">
                                    <i className="ph-fill ph-check-square-offset text-blue-600 print:text-black"></i> PART 4. Challenge
                                </h2>
                                
                                <div className="space-y-12 print:space-y-8">
                                    <div>
                                        <div className="bg-slate-50 border border-slate-200 p-5 rounded-lg mb-4 print:bg-white print:border-none print:p-0 print:mb-4">
                                            <p className="font-bold text-slate-800 mb-2 print:text-black">Q1. 내용 불일치 파악</p>
                                            <p className="text-sm text-slate-600 print:text-black">본문의 내용과 일치하지 <u>않는</u> 것은?</p>
                                        </div>
                                        <div className="space-y-2 print:space-y-3">
                                            {[
                                                { id: 1, text: "브롱스의 갱단 대표들은 더 나은 공동체를 만들기 위해 평화 협정에 서명했다." },
                                                { id: 2, text: "DJ Kool Herc는 두 개의 동일한 레코드판을 사용하여 브레이크 구간을 연장했다." },
                                                { id: 3, text: "힙합이라는 단어의 기원은 공식적인 기록을 통해 명확하게 밝혀져 있다.", isCorrect: true },
                                                { id: 4, text: "노래 <The Message>는 힙합이 사회 비판의 메시지를 담는 전통을 시작하게 했다." }
                                            ].map((choice) => (
                                                <button key={choice.id} onClick={() => setQuiz1Answered(choice.id)} disabled={quiz1Answered !== null}
                                                    className={`w-full text-left p-4 rounded-lg border font-medium transition-all duration-200 print:border-none print:p-1 print:text-black
                                                        ${quiz1Answered === null ? 'border-slate-200 hover:border-blue-400 hover:bg-blue-50' : 
                                                        (choice.isCorrect ? 'border-green-500 bg-green-50 text-green-800 shadow-sm' : 
                                                        (quiz1Answered === choice.id ? 'border-red-400 bg-red-50 text-red-600' : 'border-slate-100 text-slate-400 opacity-50'))}`}
                                                >
                                                    <span className="w-8 inline-block font-mono text-slate-500 print:text-black">{['①', '②', '③', '④'][choice.id - 1]}</span> {choice.text}
                                                </button>
                                            ))}
                                        </div>
                                        {quiz1Answered !== null && (
                                            <div className={`mt-4 p-4 rounded-lg text-sm leading-relaxed print:hidden ${quiz1Answered === 3 ? 'bg-green-50 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}`}>
                                                <p className="font-bold mb-1">{quiz1Answered === 3 ? '🎉 정답입니다!' : '오답입니다.'}</p>
                                                <p><strong>해설:</strong> 본문 30번 문장에 따르면 힙합이라는 단어의 정확한 기원은 아무도 모르며(Nobody knows the exact origin), 블록 파티에서 장난스럽게 처음 사용되었다고 전해질 뿐입니다[cite: 7].</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="border-t border-slate-200 pt-8 print:border-black print:pt-4">
                                        <div className="bg-slate-50 border border-slate-200 p-5 rounded-lg mb-4 print:bg-white print:border-none print:p-0 print:mb-4">
                                            <p className="font-bold text-slate-800 mb-2 print:text-black">Q2. 어법 판단</p>
                                            <p className="text-sm text-slate-600 mb-4 print:text-black">다음 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?</p>
                                            <p className="text-md leading-relaxed bg-white p-4 border border-slate-200 rounded print:border-slate-400 print:rounded-none print:text-black">
                                                (A) Never again <strong>[ they will / will they ]</strong> use violence to solve their disputes.<br/><br/>
                                                (B) At this party, <strong>[ using / used ]</strong> two turntables at the same time, Herc played two copies of the same record...<br/><br/>
                                                (C) The phrase "something from nothing" ... is also an expression of admiration for early hip-hoppers, <strong>[ which / who ]</strong> developed a new culture...
                                            </p>
                                        </div>
                                        <div className="space-y-2 print:space-y-3">
                                            {[
                                                { id: 1, text: "(A) they will —— (B) used —— (C) who" },
                                                { id: 2, text: "(A) will they —— (B) using —— (C) who", isCorrect: true },
                                                { id: 3, text: "(A) will they —— (B) using —— (C) which" },
                                                { id: 4, text: "(A) they will —— (B) using —— (C) which" }
                                            ].map((choice) => (
                                                <button key={choice.id} onClick={() => setQuiz2Answered(choice.id)} disabled={quiz2Answered !== null}
                                                    className={`w-full text-left p-4 rounded-lg border font-medium transition-all duration-200 print:border-none print:p-1 print:text-black
                                                        ${quiz2Answered === null ? 'border-slate-200 hover:border-blue-400 hover:bg-blue-50' : 
                                                        (choice.isCorrect ? 'border-green-500 bg-green-50 text-green-800 shadow-sm' : 
                                                        (quiz2Answered === choice.id ? 'border-red-400 bg-red-50 text-red-600' : 'border-slate-100 text-slate-400 opacity-50'))}`}
                                                >
                                                    <span className="w-8 inline-block font-mono text-slate-500 print:text-black">{['①', '②', '③', '④'][choice.id - 1]}</span> {choice.text}
                                                </button>
                                            ))}
                                        </div>
                                        {quiz2Answered !== null && (
                                            <div className={`mt-4 p-4 rounded-lg text-sm leading-relaxed print:hidden ${quiz2Answered === 2 ? 'bg-green-50 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}`}>
                                                <p className="font-bold mb-1">{quiz2Answered === 2 ? '🎉 정답입니다!' : '오답입니다.'}</p>
                                                <p><strong>해설:</strong><br/>
                                                (A) 부정어(Never again)가 문두로 와서 조동사(will)와 주어(they)가 도치되었습니다.<br/>
                                                (B) Herc가 능동적으로 두 개의 턴테이블을 사용하므로 현재분사 using을 쓴 분사구문이 적절합니다.<br/>
                                                (C) 선행사가 사람(early hip-hoppers)이므로 계속적 용법의 관계대명사는 who를 사용합니다[cite: 7].
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </main>

                <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-2 pb-safe z-30 shadow-[0_-5px_10px_rgba(0,0,0,0.05)] print:hidden">
                    <button onClick={() => setActiveTab('text')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'text' ? 'text-blue-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'text' ? 'ph-fill' : 'ph'} ph-book-open text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">지문 분석</span>
                    </button>
                    <button onClick={() => setActiveTab('syntax')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'syntax' ? 'text-blue-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'syntax' ? 'ph-fill' : 'ph'} ph-highlighter-circle text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">핵심 구문</span>
                    </button>
                    <button onClick={() => setActiveTab('map')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'map' ? 'text-blue-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'map' ? 'ph-fill' : 'ph'} ph-git-merge text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">논리 구조도</span>
                    </button>
                    <button onClick={() => setActiveTab('quiz')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'quiz' ? 'text-blue-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'quiz' ? 'ph-fill' : 'ph'} ph-check-square-offset text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">실전 문제</span>
                    </button>
                </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
