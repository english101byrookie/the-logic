    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const textData = [
          // Part 1: The Dark Times
          { id: 1, text: "One evening in late November 1932, a bitterly cold wind blows fiercely as two figures emerge from a laboratory.", trans: "1932년 11월 말 어느 날 저녁, 몹시 차가운 바람이 거세게 부는 가운데 두 명의 인물이 실험실에서 모습을 드러낸다." },
          { id: 2, text: "Darkness begins to fall as they set out into a world of failed banks, collapsed industry, and widespread despair—a world ruined by three years of the Great Depression.", trans: "그들이 파산한 은행들, 붕괴된 산업, 그리고 널리 퍼진 절망의 세계-3년간의 대공황으로 폐허가 된 세계-로 나아갈 때 어둠이 내리기 시작한다." },
          { id: 3, text: "The workday has come to an end, but for Pearl Kendrick and Grace Eldering, a different kind of work is about to begin.", trans: "근무는 끝났지만, Pearl Kendrick과 Grace Eldering에게는 다른 종류의 일이 시작될 참이다." },
          { id: 4, text: "They are on their way to visit the homes of children suffering from a deadly disease called pertussis.", trans: "그들은 백일해라고 불리는 치명적인 질병으로 고통받고 있는 어린이들의 집들을 방문하러 가는 길이다." },
          { id: 5, text: "The two women go from home to home collecting samples from the sick children by the faint light of their lamps.", trans: "두 여성은 집집마다 돌아다니면서 희미한 램프 불빛에 의지해 아픈 아이들의 검체를 수집한다." },
          { id: 6, text: "They listen to the tragic stories of desperate and unemployed parents as the children, coughing uncontrollably and struggling to breathe, barely hold on to life.", trans: "걷잡을 수 없이 기침하며 숨을 쉬기 위해 고군분투하는 아이들이 간신히 생을 붙잡고 있을 때, 그들은 자포자기하고 실직한 부모들의 비극적인 이야기를 듣는다.", isHighlight: true, logicPoint: 1 },
          { id: 7, text: "Pertussis is a bacterial disease characterized by serious coughing, breathing difficulties, and the high-pitched \"whooping\" sound that people with the disease make as they try to breathe in.", trans: "백일해는 심각한 기침, 호흡 곤란, 그리고 이 질병에 걸린 사람들이 숨을 들이쉬려 할 때 내는 고음의 '흡(whooping)' 소리로 특징지어지는 세균성 질환이다." },
          { id: 8, text: "Because of this distinct sound, people started to call the disease \"whooping cough.\"", trans: "이 독특한 소리 때문에 사람들은 이 질병을 'whooping cough(백일해)'라고 부르기 시작했다." },
          { id: 9, text: "For a long time, this terrible illness was one of the greatest terrors of families with young children, because babies who contracted it had a high chance of dying.", trans: "오랫동안, 이 끔찍한 병은 어린아이들이 있는 가정의 가장 큰 공포 중 하나였는데, 백일해에 걸린 아기는 사망할 확률이 높았기 때문이다." },
          { id: 10, text: "In the 1930s, an average of 6,000 people died of whooping cough in the United States each year. Ninety-five percent of them were children under five years of age.", trans: "1930년대에, 미국에서는 매년 평균 6,000명이 백일해로 사망했다. 그들 중 95%가 5세 미만의 어린이였다." },
          { id: 11, text: "The cause of the disease had been identified in 1906, but the vaccines that had been developed were ineffective.", trans: "그 질병의 원인은 1906년에 밝혀졌지만, 개발된 백신은 효과가 없었다." },
          { id: 12, text: "Scientists and researchers worked for more than 20 years to produce an effective one, but their efforts were fruitless until Kendrick and Eldering came along.", trans: "과학자들과 연구원들은 효과적인 백신을 만들기 위해 20년 이상 노력했지만, 그들의 노력은 성과가 없었다- Kendrick과 Eldering이 나타나기 전까지는 말이다." },

          // Part 2: Motivation & Unpaid Work
          { id: 13, text: "Pearl Kendrick studied bacteriology in university and was recruited by the Michigan Department of Health in 1920.", trans: "Pearl Kendrick은 대학에서 세균학을 공부했고 1920년 미시간주 보건부에 채용되었다." },
          { id: 14, text: "It was there that she met fellow bacteriologist Grace Eldering.", trans: "그녀가 동료 세균학자인 Grace Eldering을 만난 것은 바로 그곳에서였다." },
          { id: 15, text: "The two quickly bonded, and in 1932 they started working together on a vaccine for whooping cough.", trans: "두 사람은 빠르게 유대감을 형성했고, 1932년에 백일해 백신을 함께 연구하기 시작했다." },
          { id: 16, text: "Personal experience served as motivation for both of them, as they had each survived whooping cough as children themselves and remembered the severe pain of the disease.", trans: "개인적 경험이 두 사람 모두에게 동기가 되었는데, 둘 다 어린 시절 백일해를 직접 이겨냈고 그 질병의 극심한 고통을 기억하고 있었기 때문이다." },
          { id: 17, text: "Both scientists were also eager to promote children's health.", trans: "두 과학자는 또한 아이들의 건강을 증진시키기를 간절히 바랐다." },
          { id: 18, text: "Unfortunately, research funding was extremely limited due to the Great Depression.", trans: "안타깝게도 대공황으로 인해 연구 자금이 극히 제한되었다." },
          { id: 19, text: "Also, Kendrick and Eldering had to develop the vaccine as a side project. It was like having a second job for which they never received any payment.", trans: "또한 Kendrick과 Eldering은 부가적인 프로젝트로 백신을 개발해야 했다. 그것은 마치 어떠한 보수도 받지 못하는 두 번째 직업을 갖는 것과 같았다.", isHighlight: true, logicPoint: 2 },
          { id: 20, text: "Still, when they finished their normal duties each day, they would get started on the work that they were enthusiastic about.", trans: "그럼에도 불구하고 그들은 매일 일상적인 업무를 마치고 나면, 그들이 열의를 가진 일을 시작하곤 했다." },
          { id: 21, text: "The difficulties they faced did not stop them from persisting toward their goal.", trans: "그들이 직면한 어려움들은 그들이 목표를 향해 끈질기게 나아가는 것을 막지 못했다." },
          { id: 22, text: "They did not do the work to make extra money; instead, they worked to relieve the suffering of innocent children and their families.", trans: "그들은 돈을 추가로 벌기 위해 그 일을 한 것이 아니었다. 그보다는, 그들은 죄 없는 아이들과 그들의 가족들의 고통을 덜어주기 위해 연구했다." },

          // Part 3: The Process & Sacrifice
          { id: 23, text: "They began the process of developing their vaccine by gathering samples of the bacteria that cause whooping cough.", trans: "그들은 백일해의 원인이 되는 세균의 검체를 수집함으로써 백신을 개발하는 과정을 시작했다." },
          { id: 24, text: "To support them, local doctors and nurses provided \"cough plates\" from their patients.", trans: "그들을 지원하기 위해, 지역 의사들과 간호사들은 그들의 환자들에게서 얻은 '기침판'을 제공했다." },
          { id: 25, text: "The patients coughed onto a petri dish, which was then put into an incubator. This allowed the bacteria to grow into colonies that Kendrick and Eldering could analyze.", trans: "환자들은 페트리 접시 위에 기침했고, 그런 다음 그것은 세균 배양기에 넣어졌다. 이는 세균이 Kendrick과 Eldering이 분석할 수 있는 군집으로 자라게 했다." },
          { id: 26, text: "When they collected samples on their own, they would go to the homes of sick children. Each time, they were reminded once again of the dreadful suffering caused by the disease.", trans: "직접 검체를 수집할 때, 그들은 아픈 아이들의 집으로 가곤 했다. 그때마다, 그들은 그 병에 의해 야기된 끔찍한 고통을 다시 한번 떠올렸다." },
          { id: 27, text: "The sight of these innocent young victims coughing and struggling to breathe was a powerful reminder of the urgent need for an effective vaccine.", trans: "이 무고한 어린 희생자들이 기침하고 숨쉬기 위해 고군분투하는 모습은 효과적인 백신의 시급한 필요성을 강력하게 상기시켰다." },
          { id: 28, text: "Kendrick and Eldering spent many long nights studying the bacteria and finally produced a potential vaccine.", trans: "Kendrick과 Eldering은 세균을 연구하며 많은 긴 밤을 보냈고, 마침내 잠재적인 백신을 생산해 냈다." },
          { id: 29, text: "Before they performed any clinical trials, though, they had to be certain that it would not have any negative side effects on the subjects.", trans: "그러나 임상 실험을 실시하기 전에, 그들은 그것이 실험 대상자들에게 어떠한 부정적인 부작용도 일으키지 않을 것이라는 것을 확실히 해야 했다." },
          { id: 30, text: "They ran many laboratory tests, and they even injected it into themselves to confirm that it was safe.", trans: "그들은 많은 실험실 시험을 실행했고, 심지어 그들은 그것이 안전하다는 것을 확인하기 위해 스스로에게 주사했다.", isHighlight: true, logicPoint: 3 },
          { id: 31, text: "From 1934 to 1935, they conducted their first field test with 1,592 children.", trans: "1934년부터 1935년까지, 그들은 1,592명의 아이들을 대상으로 첫 현장 실험을 실시했다." },
          { id: 32, text: "In the group of 712 vaccinated children, only four developed whooping cough, and none of these cases were serious.", trans: "백신을 접종한 712명의 아이들의 그룹에서, 단지 4명만이 백일해에 걸렸고, 이 사례들 중 어떠한 사례도 심각하지 않았다." },

          // Part 4: The Turning Point (Eleanor Roosevelt)
          { id: 33, text: "Despite the apparent success of the vaccine, Kendrick and Eldering wanted further confirmation of its effectiveness.", trans: "백신의 분명한 성공에도 불구하고, Kendrick과 Eldering은 백신의 효과에 대한 추가 확인을 원했다." },
          { id: 34, text: "They became determined to expand their research and run more tests with larger groups of children.", trans: "그들은 연구를 확대하고 더 큰 그룹의 어린이들을 대상으로 더 많은 실험을 진행하기로 굳게 결심했다." },
          { id: 35, text: "However, they were unable to proceed because they were facing a severe lack of funds.", trans: "그러나 그들은 심각한 자금 부족에 직면하고 있었기 때문에 계속 진행할 수 없었다." },
          { id: 36, text: "With thousands of children continuing to suffer from the disease, they found themselves in a desperate situation.", trans: "수천 명의 어린이들이 계속해서 그 질병으로 고통받고 있는 가운데, 그들은 절망적인 상황에 처했다." },
          { id: 37, text: "Luckily, they got help from an unexpected figure.", trans: "다행히도 그들은 예상치 못한 인물로부터 도움을 받았다." },
          { id: 38, text: "In 1936, First Lady Eleanor Roosevelt herself visited the laboratory and saw with her own eyes the efforts that Kendrick and Eldering were making in their battle against whooping cough.", trans: "1936년에 영부인 Eleanor Roosevelt가 직접 실험실을 방문했고 Kendrick과 Eldering이 백일해와의 싸움에 기울이는 노력을 직접 보았다.", isHighlight: true, logicPoint: 4 },
          { id: 39, text: "Eleanor Roosevelt, whose husband suffered from polio, was interested in fighting infectious diseases.", trans: "남편이 소아마비를 앓았던 Eleanor Roosevelt는 전염병을 퇴치하는 것에 관심이 많았다." },
          { id: 40, text: "She spent time with the women and came to realize the enormous importance of their work.", trans: "그녀는 두 여성과 함께 시간을 보냈고, 그들의 일의 엄청난 중요성을 깨닫게 되었다." },
          { id: 41, text: "With her help, Kendrick and Eldering were able to secure enough funding to conduct a large-scale trial.", trans: "그녀의 도움으로 Kendrick과 Eldering은 대규모 실험을 실시하기에 충분한 자금을 확보할 수 있었다." },

          // Part 5: Success and Humility
          { id: 42, text: "By 1937, Kendrick and Eldering were able to include more than 4,200 children in their trial.", trans: "1937년까지 Kendrick과 Eldering은 4,200명 이상의 어린이들을 그들의 실험에 포함시킬 수 있었다." },
          { id: 43, text: "Just as in their first field test, the vaccinated group demonstrated a high level of immunity against the disease.", trans: "첫 번째 현장 실험에서와 같이, 백신을 접종한 그룹은 질병에 대해 높은 수준의 면역력을 보여주었다." },
          { id: 44, text: "The scientific community was amazed at the results, and, in 1940, the vaccine started being distributed all across the United States.", trans: "과학계는 그 결과에 깜짝 놀랐고, 1940년에 백신이 미국 전역으로 배포되기 시작했다." },
          { id: 45, text: "Four years later, it was added to the American Medical Association's list of recommended immunizations, and soon after, there was a dramatic decline in whooping cough infections.", trans: "4년 후, 이것은 미국 의학 협회의 권장 예방접종 목록에 추가되었고, 얼마 지나지 않아 백일해 감염은 극적으로 감소했다." },
          { id: 46, text: "In the mid-1970s, the number of annual deaths caused by whooping cough, which had reached 7,518 in 1934, dropped to under 10.", trans: "1934년에 7,518명에 달했던 백일해로 인한 연간 사망자 수는 1970년대 중반에 10명 미만으로 떨어졌다." },
          { id: 47, text: "Kendrick and Eldering were often told that they could have become very wealthy if they had patented their vaccine.", trans: "Kendrick과 Eldering은 그들이 백신으로 특허를 받았더라면 매우 부유해질 수도 있었을 것이라는 말을 자주 들었다." },
          { id: 48, text: "However, they replied that it had not been created by them alone, but with the help of many others.", trans: "그러나 그들은 그것은 둘이서만 만든 것이 아니라, 다른 많은 사람들의 도움으로 만들어졌다고 대답했다." },
          { id: 49, text: "They also avoided personal interviews, not wanting to reveal the great contribution they had made.", trans: "그들은 또한 자신들의 큰 공헌을 드러내고 싶지 않아 개인적인 인터뷰를 피했다." },
          { id: 50, text: "They said that they had genuinely enjoyed the challenge of creating the vaccine, so the excessive praise that they received made them uncomfortable.", trans: "그들은 진정으로 백신을 만드는 도전을 즐겼기 때문에, 그들이 받는 지나친 칭찬은 그들을 불편하게 만든다고 말했다." },
          { id: 51, text: "In the end, knowing that so many lives were being saved thanks to their hard work was enough of a reward for these remarkable and modest heroes.", trans: "결국, 그들의 노고 덕분에 매우 많은 생명이 구해지고 있다는 것을 아는 것만으로도 이 놀랍고도 겸손한 영웅들에게는 충분한 보상인 것이었다.", isHighlight: true, logicPoint: 5 }
        ];

        const logicMapSteps = [
          { point: 1, title: "CRISIS", desc: "대공황 속 치명적인 백일해 유행", color: "bg-slate-100 border-slate-400 text-slate-800", icon: <i className="ph-fill ph-virus text-xl mb-2"></i> },
          { point: 2, title: "MOTIVATION", desc: "무보수 부가 프로젝트로 백신 개발 착수", color: "bg-teal-100 border-teal-400 text-teal-800", icon: <i className="ph-fill ph-hand-heart text-xl mb-2"></i> },
          { point: 3, title: "DEDICATION", desc: "검체 수집 및 자신의 몸에 안전성 테스트", color: "bg-emerald-100 border-emerald-400 text-emerald-800", icon: <i className="ph-fill ph-syringe text-xl mb-2"></i> },
          { point: 4, title: "TURNING POINT", desc: "영부인의 방문과 대규모 임상 자금 확보", color: "bg-cyan-100 border-cyan-400 text-cyan-800", icon: <i className="ph-fill ph-coins text-xl mb-2"></i> },
          { point: 5, title: "REWARD", desc: "사망자 급감 및 특허를 포기한 겸손함", color: "bg-sky-100 border-sky-400 text-sky-800", icon: <i className="ph-fill ph-medal text-xl mb-2"></i> }
        ];

        function App() {
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [passwordInput, setPasswordInput] = useState("");
          const [loginError, setLoginError] = useState("");
          
          const CORRECT_PASSWORD = "Made by Lee";
          const itemRefs = useRef({});

          const handleLoginSubmit = (e) => {
            e.preventDefault();
            if (passwordInput === CORRECT_PASSWORD) {
              setIsAuthenticated(true);
              setLoginError("");
            } else {
              setLoginError("올바르지 않은 암호입니다. 다시 확인해 주세요.");
              setPasswordInput("");
            }
          };

          const [activeTab, setActiveTab] = useState('text');
          const [activeLogic, setActiveLogic] = useState(null);
          
          const handleLogicClick = (point) => {
              setActiveLogic(activeLogic === point ? null : point);
              setActiveTab('text'); 
          };

          useEffect(() => {
              if (activeTab === 'text' && activeLogic !== null) {
                  const targetItem = textData.find(item => item.logicPoint === activeLogic);
                  if (targetItem && itemRefs.current[targetItem.id]) {
                      setTimeout(() => {
                          itemRefs.current[targetItem.id].scrollIntoView({ behavior: 'smooth', block: 'center' });
                      }, 150);
                  }
              }
          }, [activeLogic, activeTab]);

          const [quiz1Answered, setQuiz1Answered] = useState(null);
          const [quiz2Answered, setQuiz2Answered] = useState(null);

          const handlePrint = () => { window.print(); };

          if (!isAuthenticated) {
            return (

                                                { id: 4, text: "두 과학자는 자신들의 공헌을 크게 드러내고 싶지 않아 개인적인 인터뷰를 피했다." }
                                            ].map((choice) => (
                                                <button key={choice.id} onClick={() => setQuiz1Answered(choice.id)} disabled={quiz1Answered !== null}
                                                    className={`w-full text-left p-4 rounded-lg border font-medium transition-all duration-200 print:border-none print:p-1 print:text-black
                                                        ${quiz1Answered === null ? 'border-slate-200 hover:border-teal-400 hover:bg-teal-50' : 
                                                        (choice.isCorrect ? 'border-green-500 bg-green-50 text-green-800 shadow-sm' : 
                                                        (quiz1Answered === choice.id ? 'border-red-400 bg-red-50 text-red-600' : 'border-slate-100 text-slate-400 opacity-50'))}`}
                                                >
                                                    <span className="w-8 inline-block font-mono text-slate-500 print:text-black">{['①', '②', '③', '④'][choice.id - 1]}</span> {choice.text}
                                                </button>
                                            ))}
                                        </div>
                                        {quiz1Answered !== null && (
                                            <div className={`mt-4 p-4 rounded-lg text-sm leading-relaxed print:hidden ${quiz1Answered === 1 ? 'bg-green-50 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}`}>
                                                <p className="font-bold mb-1">{quiz1Answered === 1 ? '🎉 정답입니다!' : '오답입니다.'}</p>
                                                <p><strong>해설:</strong> 본문 11~12번 문장에 따르면 질병의 원인은 1906년에 이미 밝혀졌으나 효과적인 백신이 없었고, Kendrick과 Eldering은 그 후인 1932년부터 연구를 시작해 백신을 만들었습니다[cite: 12]. 원인을 최초 규명한 것은 그들이 아닙니다.</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="border-t border-slate-200 pt-8 print:border-black print:pt-4">
                                        <div className="bg-slate-50 border border-slate-200 p-5 rounded-lg mb-4 print:bg-white print:border-none print:p-0 print:mb-4">
                                            <p className="font-bold text-slate-800 mb-2 print:text-black">Q2. 어법 판단</p>
                                            <p className="text-sm text-slate-600 mb-4 print:text-black">다음 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?</p>
                                            <p className="text-md leading-relaxed bg-white p-4 border border-slate-200 rounded print:border-slate-400 print:rounded-none print:text-black">
                                                (A) It was there <strong>[ what / that ]</strong> she met fellow bacteriologist Grace Eldering.<br/><br/>
                                                (B) They did not do the work to make extra money; instead, they worked <strong>[ relieving / to relieve ]</strong> the suffering of innocent children.<br/><br/>
                                                (C) They could have become very wealthy if they <strong>[ patented / had patented ]</strong> their vaccine.
                                            </p>
                                        </div>
                                        <div className="space-y-2 print:space-y-3">
                                            {[
                                                { id: 1, text: "(A) what —— (B) relieving —— (C) patented" },
                                                { id: 2, text: "(A) that —— (B) to relieve —— (C) had patented", isCorrect: true },
                                                { id: 3, text: "(A) that —— (B) to relieve —— (C) patented" },
                                                { id: 4, text: "(A) what —— (B) relieving —— (C) had patented" }
                                            ].map((choice) => (
                                                <button key={choice.id} onClick={() => setQuiz2Answered(choice.id)} disabled={quiz2Answered !== null}
                                                    className={`w-full text-left p-4 rounded-lg border font-medium transition-all duration-200 print:border-none print:p-1 print:text-black
                                                        ${quiz2Answered === null ? 'border-slate-200 hover:border-teal-400 hover:bg-teal-50' : 
                                                        (choice.isCorrect ? 'border-green-500 bg-green-50 text-green-800 shadow-sm' : 
                                                        (quiz2Answered === choice.id ? 'border-red-400 bg-red-50 text-red-600' : 'border-slate-100 text-slate-400 opacity-50'))}`}
                                                >
                                                    <span className="w-8 inline-block font-mono text-slate-500 print:text-black">{['①', '②', '③', '④'][choice.id - 1]}</span> {choice.text}
                                                </button>
                                            ))}
                                        </div>
                                        {quiz2Answered !== null && (
                                            <div className={`mt-4 p-4 rounded-lg text-sm leading-relaxed print:hidden ${quiz2Answered === 2 ? 'bg-green-50 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}`}>
                                                <p className="font-bold mb-1">{quiz2Answered === 2 ? '🎉 정답입니다!' : '오답입니다.'}</p>
                                                <p><strong>해설:</strong><br/>
                                                (A) 부사구 there를 강조하는 'It was ~ that' 강조 구문이므로 that이 맞습니다.<br/>
                                                (B) 고통을 덜어주기 '위하여' 연구한 것이므로 부사적 용법의 to부정사인 to relieve가 맞습니다.<br/>
                                                (C) 과거 사실의 반대를 가정하는 가정법 과거완료 구문이므로 조건절에는 had p.p.(had patented)가 와야 합니다[cite: 12].
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </main>

                <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-2 pb-safe z-30 shadow-[0_-5px_10px_rgba(0,0,0,0.05)] print:hidden">
                    <button onClick={() => setActiveTab('text')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'text' ? 'text-teal-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'text' ? 'ph-fill' : 'ph'} ph-book-open text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">지문 분석</span>
                    </button>
                    <button onClick={() => setActiveTab('syntax')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'syntax' ? 'text-teal-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'syntax' ? 'ph-fill' : 'ph'} ph-highlighter-circle text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">핵심 구문</span>
                    </button>
                    <button onClick={() => setActiveTab('map')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'map' ? 'text-teal-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'map' ? 'ph-fill' : 'ph'} ph-git-merge text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">논리 구조도</span>
                    </button>
                    <button onClick={() => setActiveTab('quiz')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'quiz' ? 'text-teal-700' : 'text-slate-400 hover:text-slate-600'}`}>
                        <i className={`${activeTab === 'quiz' ? 'ph-fill' : 'ph'} ph-check-square-offset text-2xl mb-1`}></i>
                        <span className="text-[10px] font-bold">실전 문제</span>
                    </button>
                </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
