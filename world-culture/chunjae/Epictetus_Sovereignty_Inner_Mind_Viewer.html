<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>사대부고 2학년 2학기 중간 유인물 - 완벽 분석 강의 뷰어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-sub: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-bg: rgba(56, 189, 248, 0.12);
      --highlight: #fef08a;
      --highlight-text: #854d0e;
      --border-color: #475569;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --font-passage: 'Lora', Georgia, serif;
    }
    body.theme-light {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-sub: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-bg: rgba(2, 132, 199, 0.08);
      --highlight: #fef9c3;
      --highlight-text: #713f12;
      --border-color: #cbd5e1;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .title-area { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .main-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 2px; }
    .toolbar::-webkit-scrollbar { display: none; }
    .btn {
      background-color: var(--bg-card-sub);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background-color: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.active { background-color: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-edit { background: rgba(56, 189, 248, 0.15); color: var(--accent); border-color: var(--accent); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: #ef4444; }
    .btn-danger:hover { background: #ef4444; color: #fff; }
    .btn-tiny { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; }
    .workspace { flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
    .mode-split { grid-template-columns: 1.15fr 1fr; }
    .mode-focus { grid-template-columns: 1fr; max-width: 960px; }
    .card { background-color: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow); padding: 20px; position: relative; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .passage-body {
      font-family: var(--font-passage);
      font-size: 1.18rem;
      line-height: 1.85;
      color: var(--text-main);
      letter-spacing: -0.01em;
      white-space: pre-line;
    }
    .passage-body em, .passage-body i { font-style: italic; color: #38bdf8; font-family: var(--font-passage); }
    body.theme-light .passage-body em, body.theme-light .passage-body i { color: #0284c7; }
    .vocab-hl {
      background-color: var(--highlight);
      color: var(--highlight-text);
      padding: 2px 4px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid #ca8a04;
      transition: all 0.2s;
    }
    .vocab-hl:hover { filter: brightness(0.95); transform: translateY(-1px); }
    .korean-box {
      margin-top: 20px;
      background: var(--bg-card-sub);
      border-radius: 8px;
      padding: 14px 16px;
      border-left: 4px solid var(--accent);
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-main);
      display: none;
      white-space: pre-line;
    }
    .korean-box.show { display: block; }
    .side-panel { display: flex; flex-direction: column; gap: 16px; }
    .key-points-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .key-points-list li { position: relative; padding-left: 18px; font-size: 0.92rem; line-height: 1.6; color: var(--text-main); }
    .key-points-list li::before { content: "•"; position: absolute; left: 0; color: var(--accent); font-weight: bold; font-size: 1.2rem; line-height: 1; }
    .vocab-grid { display: flex; flex-direction: column; gap: 10px; }
    .vocab-item { background: var(--bg-card-sub); border-radius: 8px; padding: 12px 14px; border: 1px solid var(--border-color); transition: border-color 0.2s; position: relative; }
    .vocab-item.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
    .vocab-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .vocab-word { font-size: 0.98rem; font-weight: 700; color: var(--accent); }
    .vocab-meaning { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    .vocab-desc { font-size: 0.82rem; color: var(--text-sub); line-height: 1.45; }
    .nuance-item { background: var(--bg-card-sub); border-radius: 8px; padding: 12px 14px; border: 1px solid var(--border-color); }
    .nuance-title { font-size: 0.92rem; font-weight: 700; color: #fbbf24; margin-bottom: 6px; }
    .nuance-desc { font-size: 0.86rem; color: var(--text-main); line-height: 1.6; white-space: pre-line; }
    footer {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-color);
      padding: 10px 16px;
      position: sticky;
      bottom: 0;
      z-index: 100;
    }
    .footer-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .progress-bar-wrap { flex: 1; max-width: 450px; background: var(--bg-card-sub); height: 8px; border-radius: 4px; overflow: hidden; position: relative; }
    .progress-bar { background: linear-gradient(90deg, #0284c7, #38bdf8); height: 100%; width: 0%; transition: width 0.3s; }
    .indicator { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal-box { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    .form-input, .form-textarea { width: 100%; background: var(--bg-card-sub); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; color: var(--text-main); font-family: inherit; font-size: 0.92rem; }
    .form-textarea { min-height: 120px; line-height: 1.6; resize: vertical; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .passage-body { font-size: 1.06rem; line-height: 1.75; }
    }
  </style>
</head>
<body class="theme-dark">
  <header>
    <div class="header-content">
      <div class="title-area">
        <span class="badge">완벽 분석</span>
        <div class="main-title">사대부고 2학년 2학기 중간 유인물 - Epictetus and the Sovereignty of the Inner Mind</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="btnViewFocus" onclick="setViewMode('focus')">📖 지문 집중</button>
        <button class="btn active" id="btnViewSplit" onclick="setViewMode('split')">📊 분할 해설</button>
        <button class="btn" id="btnToggleKorean" onclick="toggleKorean()">🌐 한국어 해석</button>
        <button class="btn" onclick="toggleTheme()">🌓 테마</button>
        <button class="btn" onclick="changeFontSize(1)">A+</button>
        <button class="btn" onclick="changeFontSize(-1)">A-</button>
        <button class="btn" onclick="exportData()">💾 내보내기</button>
        <button class="btn btn-danger" onclick="resetToDefault()">🔄 초기화</button>
      </div>
    </div>
  </header>

  <main class="workspace mode-split" id="workspace">
    <div class="card">
      <div class="card-header">
        <div class="card-title" id="slideHeaderBadge">본문 영역</div>
        <div><button class="btn btn-edit btn-tiny" onclick="openPassageEditModal()">✏️ 본문·해석 수정</button></div>
      </div>
      <div class="passage-body" id="passageText"></div>
      <div class="korean-box" id="koreanBox"></div>
    </div>

    <div class="side-panel" id="sidePanel">
      <div class="card">
        <div class="card-header">
          <div class="card-title">💡 핵심 요약 (Key Points)</div>
          <div><button class="btn btn-edit btn-tiny" onclick="openKeyPointsEditModal()">✏️ 요약 수정</button></div>
        </div>
        <ul class="key-points-list" id="keyPointsList"></ul>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">📚 핵심 어휘 &amp; 문맥적 의미</div>
          <div><button class="btn btn-edit btn-tiny" onclick="openVocabAddModal()">+ 새 어휘 추가</button></div>
        </div>
        <div class="vocab-grid" id="vocabList"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">🔍 어휘 뉘앙스 &amp; 구문 심층 분석</div>
          <div><button class="btn btn-edit btn-tiny" onclick="openNuanceAddModal()">+ 새 구문 추가</button></div>
        </div>
        <div class="vocab-grid" id="nuanceList"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <button class="btn" onclick="prevSlide()">◀ 이전 문단</button>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <span class="indicator" id="slideIndicator">01 / 01</span>
      <button class="btn" onclick="nextSlide()">다음 문단 ▶</button>
    </div>
  </footer>

  <!-- Modal: Edit Passage & Korean -->
  <div class="modal" id="modalPassage">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px; color: var(--accent);">본문 및 해석 수정</h3>
      <div class="form-group">
        <label>문단 소제목 / 번호</label>
        <input type="text" class="form-input" id="inpPassageTitle" />
      </div>
      <div class="form-group">
        <label>영어 본문 (이탤릭체: <i>*텍스트*</i>, 굵게: <b>**텍스트**</b>)</label>
        <div style="display: flex; gap: 8px; align-items: center; background: var(--bg-card-sub); padding: 8px 12px; border-radius: 8px 8px 0 0; border: 1px solid var(--border-color); border-bottom: none;">
          <span style="font-size: 0.82rem; font-weight: 700; color: var(--text-sub); margin-right: 4px;">서식 적용:</span>
          <button type="button" class="btn btn-tiny btn-edit" style="font-style: italic; font-weight: 700; padding: 4px 10px;" onclick="applyFormatting('inpPassageEnglish', '*', '*')"><i>I</i> 이탤릭체 (*선택영역*)</button>
          <button type="button" class="btn btn-tiny btn-edit" style="font-weight: 700; padding: 4px 10px;" onclick="applyFormatting('inpPassageEnglish', '**', '**')"><b>B</b> 굵게 (**선택영역**)</button>
          <button type="button" class="btn btn-tiny btn-edit" style="padding: 4px 10px;" onclick="applyFormatting('inpPassageEnglish', '<u>', '</u>')"><u>U</u> 밑줄</button>
          <button type="button" class="btn btn-tiny btn-edit" style="padding: 4px 10px;" onclick="applyFormatting('inpPassageEnglish', '<mark>', '</mark>')">💡 형광펜</button>
        </div>
        <textarea class="form-textarea" id="inpPassageEnglish" style="border-radius: 0 0 8px 8px; min-height: 180px;"></textarea>
      </div>
      <div class="form-group">
        <label>한국어 전문 해석</label>
        <textarea class="form-textarea" id="inpPassageKorean" style="min-height: 140px;"></textarea>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" onclick="closeModal('modalPassage')">취소</button>
        <button class="btn btn-edit" onclick="savePassageEdit()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Modal: Edit Key Points -->
  <div class="modal" id="modalKeyPoints">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px; color: var(--accent);">핵심 요약 수정</h3>
      <div class="form-group">
        <label>요약 내용 (한 줄에 하나씩 작성)</label>
        <textarea class="form-textarea" id="inpKeyPoints" style="min-height: 160px;"></textarea>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" onclick="closeModal('modalKeyPoints')">취소</button>
        <button class="btn btn-edit" onclick="saveKeyPointsEdit()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add/Edit Vocab -->
  <div class="modal" id="modalVocab">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px; color: var(--accent);" id="modalVocabTitle">어휘 추가 / 수정</h3>
      <input type="hidden" id="inpVocabIndex" value="-1" />
      <div class="form-group"><label>영어 단어 / 구문</label><input type="text" class="form-input" id="inpVocabWord" /></div>
      <div class="form-group"><label>한국어 뜻</label><input type="text" class="form-input" id="inpVocabMeaning" /></div>
      <div class="form-group"><label>문맥적 설명 / 해설</label><textarea class="form-textarea" id="inpVocabDesc" style="min-height: 80px;"></textarea></div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" onclick="closeModal('modalVocab')">취소</button>
        <button class="btn btn-edit" onclick="saveVocabItem()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add/Edit Nuance -->
  <div class="modal" id="modalNuance">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px; color: var(--accent);" id="modalNuanceTitle">구문 / 뉘앙스 추가 / 수정</h3>
      <input type="hidden" id="inpNuanceIndex" value="-1" />
      <div class="form-group"><label>구문 분석 제목</label><input type="text" class="form-input" id="inpNuanceTitle" /></div>
      <div class="form-group"><label>상세 분석 내용</label><textarea class="form-textarea" id="inpNuanceDesc" style="min-height: 140px;"></textarea></div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" onclick="closeModal('modalNuance')">취소</button>
        <button class="btn btn-edit" onclick="saveNuanceItem()">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_DATA = [
  {
    "id": 1,
    "section": "에픽테토스의 생애와 부러진 다리",
    "title": "01. 스토아 철학의 이례적 배경과 노예 출신 철학자의 탄생",
    "english": "In the long tradition of Stoic philosophy, many celebrated thinkers were individuals of wealth, power, and political influence. For them, freedom was often an elevated, abstract concept discussed in comfortable settings. Epictetus, however, occupied a fundamentally different reality. Born into slavery in the Roman Empire, he experienced human powerlessness and physical vulnerability not as a theoretical topic, but as a condition of daily survival. His master was notoriously cruel, at one point twisting young Epictetus's leg with intense force. Rather than screaming or weeping, Epictetus remained calm, simply stating, \"If you keep twisting, it will break.\" When the leg finally snapped, Epictetus merely looked at his master and remarked, \"Didn't I warn you?\" This severe incident left him with a lifelong limp, yet it revealed a foundational truth that would define his philosophy: while external forces can damage the physical body, they possess no power to break the inner will of a human being unless the mind surrenders its own sovereignty.",
    "korean": "스토아 철학의 오랜 전통에서 많은 유명한 사상가들은 부, 권력, 정치적 영향력을 지닌 인물들이었습니다. 그들에게 자유는 종종 안락한 환경에서 논의되는 고상하고 추상적인 개념이었습니다. 그러나 에픽테토스는 근본적으로 다른 현실에 처해 있었습니다. 로마 제국에서 노예로 태어난 그는 인간의 무력함과 육체적 취약성을 이론적 주제가 아니라 일상적 생존의 조건으로 경험했습니다. 그의 주인은 악명 높을 정도로 잔인하여, 한 번은 어린 에픽테토스의 다리를 강한 힘으로 비틀었습니다. 비명을 지르거나 우는 대신 에픽테토스는 침착함을 유지하며 그저 \"계속 비틀면 부러질 것입니다\"라고 말했습니다. 마침내 다리가 부러졌을 때, 에픽테토스는 주인을 담담히 바라보며 \"내가 경고하지 않았던가요?\"라고 말했습니다. 이 가혹한 사건으로 그는 평생 다리를 절게 되었지만, 그의 철학을 규정할 근본적인 진실을 드러냈습니다. 외부의 힘이 육체를 훼손할 수는 있지만, 정신이 스스로의 주권을 포기하지 않는 한 인간의 내면적 의지를 꺾을 힘은 전혀 없다는 것입니다.",
    "key_points": [
      "기존 귀족·권력자 스토아 철학자들과 궤를 달리하는 노예 출신 에픽테토스의 생존 현실",
      "잔혹한 주인의 다리 비틀기 폭력 앞에서도 평정을 잃지 않은 일화",
      "철학의 근본 진리: 외부 세력은 육체를 상하게 할 수 있어도 내면의 주권(Sovereignty)은 꺾을 수 없음"
    ],
    "vocab": [
      {
        "word": "Stoic philosophy",
        "meaning": "스토아 철학",
        "desc": "이성과 절제를 통해 마음의 평정을 추구하는 고대 헬레니즘 철학"
      },
      {
        "word": "elevated",
        "meaning": "고상한, 고결한, 높은",
        "desc": "추상적이고 관념적인 경지"
      },
      {
        "word": "vulnerability",
        "meaning": "취약성, 상처받기 쉬움",
        "desc": "신체적·심리적 연약함"
      },
      {

    const STORAGE_KEY = "VIEWER_DATA_Epictetus_Sovereignty_Inner_Mind_Viewer_html";
    let lessonData = [];
    let currentIndex = 0;
    let viewMode = 'split';
    let showKorean = false;
    let fontSizeLevel = 0;

    function initData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { lessonData = JSON.parse(saved); } catch(e) { lessonData = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
      } else {
        lessonData = JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
      renderSlide(currentIndex);
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lessonData));
    }

    function parseMarkdownItalics(text) {
      if (!text) return "";
      let res = text.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      res = res.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      res = res.replace(/\*(.*?)\*/g, '<em>$1</em>');
      res = res.replace(/\_(.*?)\_/g, '<em>$1</em>');
      return res;
    }

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= lessonData.length) idx = lessonData.length - 1;
      currentIndex = idx;
      const cur = lessonData[currentIndex];

      document.getElementById('slideHeaderBadge').textContent = `${cur.section} - ${cur.title}`;
      document.getElementById('slideIndicator').textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(lessonData.length).padStart(2, '0')}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / lessonData.length) * 100}%`;

      // Render Passage with safe single-pass vocab matcher & Markdown Italics
      const wordsToHighlight = (cur.vocab || []).map(v => v.word.trim()).filter(w => w.length > 0);
      wordsToHighlight.sort((a, b) => b.length - a.length);

      let processedText = cur.english;
      if (wordsToHighlight.length > 0) {
        const escaped = wordsToHighlight.map(w => w.replace(/[-\/\\^$*+?.()|[\]{}"]/g, '\\$&'));
        const regex = new RegExp(`\\b(${escaped.join('|')})\\b`, 'gi');
        processedText = processedText.replace(regex, '<span class="vocab-hl" onclick="highlightVocabCard(\'$1\')">$1</span>');
      }
      processedText = parseMarkdownItalics(processedText);
      document.getElementById('passageText').innerHTML = processedText;

      document.getElementById('koreanBox').innerHTML = parseMarkdownItalics(cur.korean);
      if (showKorean) document.getElementById('koreanBox').classList.add('show');
      else document.getElementById('koreanBox').classList.remove('show');

      // Key points
      const kpList = document.getElementById('keyPointsList');
      kpList.innerHTML = (cur.key_points || []).map(p => `<li>${parseMarkdownItalics(p)}</li>`).join('');

      // Vocab List
      const vList = document.getElementById('vocabList');
      vList.innerHTML = (cur.vocab || []).map((v, i) => `
        <div class="vocab-item" id="vcard_${i}">
          <div class="vocab-head">
            <div><span class="vocab-word">${v.word}</span> : <span class="vocab-meaning">${v.meaning}</span></div>
            <div style="display:flex; gap:4px;">
              <button class="btn btn-tiny btn-edit" onclick="openVocabEditModal(${i})">✏️</button>
              <button class="btn btn-tiny btn-danger" onclick="deleteVocabItem(${i})">🗑️</button>
            </div>
          </div>
          <div class="vocab-desc">${parseMarkdownItalics(v.desc || '')}</div>
        </div>
      `).join('');

      // Nuances List
      const nList = document.getElementById('nuanceList');
      nList.innerHTML = (cur.nuances || []).map((n, i) => `
        <div class="nuance-item">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div class="nuance-title">${n.title}</div>
            <div style="display:flex; gap:4px;">
              <button class="btn btn-tiny btn-edit" onclick="openNuanceEditModal(${i})">✏️</button>
              <button class="btn btn-tiny btn-danger" onclick="deleteNuanceItem(${i})">🗑️</button>
            </div>
          </div>
          <div class="nuance-desc">${parseMarkdownItalics(n.desc)}</div>
        </div>
      `).join('');
    }

    function prevSlide() { if (currentIndex > 0) renderSlide(currentIndex - 1); }
    function nextSlide() { if (currentIndex < lessonData.length - 1) renderSlide(currentIndex + 1); }

    function setViewMode(mode) {
      viewMode = mode;
      const ws = document.getElementById('workspace');
      const side = document.getElementById('sidePanel');
      if (mode === 'focus') {
        ws.className = 'workspace mode-focus';
        side.style.display = 'none';
        document.getElementById('btnViewFocus').classList.add('active');
        document.getElementById('btnViewSplit').classList.remove('active');
      } else {
        ws.className = 'workspace mode-split';
        side.style.display = 'flex';
        document.getElementById('btnViewSplit').classList.add('active');
        document.getElementById('btnViewFocus').classList.remove('active');
      }
    }

    function toggleKorean() {
      showKorean = !showKorean;
      const kb = document.getElementById('koreanBox');
      const btn = document.getElementById('btnToggleKorean');
      if (showKorean) { kb.classList.add('show'); btn.classList.add('active'); }
      else { kb.classList.remove('show'); btn.classList.remove('active'); }
    }

    function toggleTheme() {
      document.body.classList.toggle('theme-light');
      document.body.classList.toggle('theme-dark');
    }

    function changeFontSize(delta) {
      fontSizeLevel += delta;
      if (fontSizeLevel > 4) fontSizeLevel = 4;
      if (fontSizeLevel < -2) fontSizeLevel = -2;
      const base = 1.18 + fontSizeLevel * 0.08;
      document.getElementById('passageText').style.fontSize = `${base}rem`;
    }

    function highlightVocabCard(word) {
      if (viewMode === 'focus') setViewMode('split');
      const cur = lessonData[currentIndex];
      const idx = (cur.vocab || []).findIndex(v => v.word.toLowerCase() === word.toLowerCase());
      if (idx !== -1) {
        const card = document.getElementById(`vcard_${idx}`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('active');
          setTimeout(() => card.classList.remove('active'), 2000);
        }
      }
    }

    function applyFormatting(textareaId, prefix, suffix) {
      const textarea = document.getElementById(textareaId);
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const val = textarea.value;
      const selected = val.substring(start, end);
      if (selected.length > 0) {
        textarea.value = val.substring(0, start) + prefix + selected + suffix + val.substring(end);
        textarea.focus();
        textarea.setSelectionRange(start + prefix.length, end + prefix.length);
      } else {
        textarea.value = val.substring(0, start) + prefix + "텍스트" + suffix + val.substring(end);
        textarea.focus();
        textarea.setSelectionRange(start + prefix.length, start + prefix.length + 3);
      }
    }

    // Modal helpers
    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function openPassageEditModal() {
      const cur = lessonData[currentIndex];
      document.getElementById('inpPassageTitle').value = cur.title || '';
      document.getElementById('inpPassageEnglish').value = cur.english || '';
      document.getElementById('inpPassageKorean').value = cur.korean || '';
      openModal('modalPassage');
    }

    function savePassageEdit() {
      const cur = lessonData[currentIndex];
      cur.title = document.getElementById('inpPassageTitle').value;
      cur.english = document.getElementById('inpPassageEnglish').value;
      cur.korean = document.getElementById('inpPassageKorean').value;

      renderSlide(currentIndex);
      closeModal('modalPassage');

    function openKeyPointsEditModal() {
      const cur = lessonData[currentIndex];

      openModal('modalKeyPoints');

    function saveKeyPointsEdit() {
      const lines = document.getElementById('inpKeyPoints').value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      saveData();
      renderSlide(currentIndex);

    }

    function openVocabAddModal() {
      document.getElementById('modalVocabTitle').textContent = '새 어휘 추가';

      document.getElementById('inpVocabWord').value = '';
      document.getElementById('inpVocabMeaning').value = '';
      document.getElementById('inpVocabDesc').value = '';

    function openVocabEditModal(idx) {
      const v = lessonData[currentIndex].vocab[idx];
      document.getElementById('modalVocabTitle').textContent = '어휘 수정';
      document.getElementById('inpVocabIndex').value = idx;
      document.getElementById('inpVocabWord').value = v.word;
      document.getElementById('inpVocabMeaning').value = v.meaning;
      document.getElementById('inpVocabDesc').value = v.desc || '';
      openModal('modalVocab');
    }

    function saveVocabItem() {
      const idx = parseInt(document.getElementById('inpVocabIndex').value, 10);
      const word = document.getElementById('inpVocabWord').value.trim();
      const meaning = document.getElementById('inpVocabMeaning').value.trim();
      const desc = document.getElementById('inpVocabDesc').value.trim();
      if (!word) return alert('단어를 입력해주세요.');
      if (!lessonData[currentIndex].vocab) lessonData[currentIndex].vocab = [];

      if (idx === -1) {
        lessonData[currentIndex].vocab.push({ word, meaning, desc });
      } else {
        lessonData[currentIndex].vocab[idx] = { word, meaning, desc };
      }
      saveData();
      renderSlide(currentIndex);
      closeModal('modalVocab');
    }

    function deleteVocabItem(idx) {
      if (confirm('이 어휘 항목을 삭제하시겠습니까?')) {
        lessonData[currentIndex].vocab.splice(idx, 1);
        saveData();
        renderSlide(currentIndex);
      }
    }

      document.getElementById('modalNuanceTitle').textContent = '새 구문 추가';

        lessonData[currentIndex].nuances[idx] = { title, desc };

    function deleteNuanceItem(idx) {

        lessonData[currentIndex].nuances.splice(idx, 1);
        saveData();
        renderSlide(currentIndex);
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lessonData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Epictetus_Sovereignty_Inner_Mind_Viewer_data.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function resetToDefault() {
      if (confirm('정말로 교재 원본 기본 데이터로 초기화하시겠습니까? (수정하신 모든 내용이 복원됩니다)')) {
        localStorage.removeItem(STORAGE_KEY);
        lessonData = JSON.parse(JSON.stringify(DEFAULT_DATA));
        renderSlide(currentIndex);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      if (e.key === 't' || e.key === 'T') toggleKorean();
      if (e.key === ' ') { e.preventDefault(); setViewMode(viewMode === 'split' ? 'focus' : 'split'); }
    });

    window.addEventListener('DOMContentLoaded', initData);
  </script>
