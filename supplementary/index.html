<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOGIC — 부교재 분석</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f8f7f4; --surface: #ffffff;
            --navy: #1a2b4a; --gold: #b8862a; --coral: #c2410c;
            --muted: #6b7280; --border: #e5e2db; --faint: #f3f1ec;
            --accent: var(--coral);
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--navy); min-height: 100vh; overflow-x: hidden; }
        #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent), var(--gold)); z-index: 100; }
        .page { max-width: 900px; margin: 0 auto; padding: 0 28px; }
        
        .topbar { padding: 24px 0 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
        .bc-link { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted); text-decoration: none; text-transform: uppercase; transition: color .2s; }
        .bc-link:hover { color: var(--navy); }
        .bc-sep { color: var(--border); font-size: 11px; margin: 0 2px; }
        .bc-current { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
        .brand-link { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 900; letter-spacing: .08em; color: var(--navy); text-decoration: none; margin-right: 4px; }
        
        .header { padding: 52px 0 44px; border-bottom: 1px solid var(--border); }
        .header-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .22em; color: var(--accent); text-transform: uppercase; margin-bottom: 14px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: clamp(34px, 6vw, 58px); font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; color: var(--navy); }
        .header h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
        .header-sub { margin-top: 12px; font-size: 14px; font-weight: 300; color: var(--muted); max-width: 480px; line-height: 1.7; }
        
        .section { padding: 44px 0 32px; }
        .section-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
        .section-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
        .section-line { flex: 1; height: 1px; background: var(--border); }
        
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .book-card { display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 26px 24px 20px; position: relative; overflow: hidden; min-height: 200px; transition: all .24s ease; }
        .book-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); opacity: .7; transition: opacity .24s; }
        .book-card.active:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.08); }
        .book-card.active:hover::before { opacity: 1; }
        .book-card.active:hover .bc-arrow { color: var(--navy); transform: translateX(4px); }
        .book-card.inactive { opacity: 0.5; pointer-events: none; cursor: default; }
        
        .bc-year { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
        .bc-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
        .bc-desc { font-size: 13px; color: var(--muted); font-weight: 300; margin-bottom: 20px; line-height: 1.5; flex: 1; }
        .bc-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--faint); padding-top: 14px; margin-top: auto; }
        .bc-status { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
        .bc-status.live { color: var(--accent); font-weight: 500; }
        .bc-arrow { font-size: 15px; color: #ccc; transition: all .24s ease; }

        footer { padding: 36px 0 48px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .footer-brand { font-family: 'Playfair Display', serif; font-size: 13px; color: #bbb; }
        .footer-note { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .12em; color: #ccc; text-transform: uppercase; }

        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        .fi { animation:fadeUp .4s ease forwards; opacity:0; }
        .fi:nth-child(1){animation-delay:.05s}.fi:nth-child(2){animation-delay:.10s}
        @media(max-width:600px){.book-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div id="progress"></div>
<div class="page">
    <nav class="topbar">
        <a href="../index.html" class="brand-link">THE LOGIC</a>
        <span class="bc-sep">/</span>
        <span class="bc-current">부교재 분석</span>
    </nav>
    <header class="header fi">
        <div class="header-eyebrow">Supplementary Material</div>
        <h1>부교재 <em>아카이브</em></h1>
        <p class="header-sub">학교 현장에서 가장 많이 활용되는 핵심 EBS 및 시중 부교재 구문·논리 분석 아카이브입니다.</p>
    </header>
    
    <section class="section">
        <div class="section-header"><span class="section-title">교재 선택</span><div class="section-line"></div></div>
        <div class="book-grid">
            
            <!-- 올림포스 영어독해 기본 2 -->
            <a href="olympos2/index.html" class="book-card active fi" style="--accent:var(--coral);">
                <div>
                    <div class="bc-year">EBS Supplementary</div>
                    <div class="bc-name">올림포스 영어독해 기본 2</div>
                    <div class="bc-desc">EBS 교재의 엄선된 지문 구조 분석 및 논리 스키마 제공</div>
                </div>
                <div class="bc-footer">
                    <span class="bc-status live" style="color:var(--coral);">● 서비스 중</span>
                    <span class="bc-arrow">→</span>
                </div>
            </a>

            <!-- 추후 확장용 카드 -->
            <div class="book-card inactive fi" style="--accent:#6b7280;">
                <div>
                    <div class="bc-year">Coming Soon</div>
                    <div class="bc-name">수능특강 Light / 수능완성 등</div>
                    <div class="bc-desc">추후 추가될 핵심 연계 교재 분석 과정입니다.</div>
                </div>
                <div class="bc-footer">
                    <span class="bc-status">준비 중</span>
                    <span class="bc-arrow">→</span>
                </div>
            </div>

        </div>
    </section>
    
    <footer>
        <div class="footer-brand">THE LOGIC</div>
        <div class="footer-note">Supplementary Portal · 2026</div>
    </footer>
</div>
<script>window.addEventListener('scroll',()=>{const e=document.getElementById('progress'),t=document.body.scrollHeight-window.innerHeight;e.style.width=(t>0?window.scrollY/t*100:0)+'%'});</script>
</body>
</html>
