<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOGIC — 고등학교 3학년 모의고사</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f8f7f4; --surface: #ffffff;
            --navy: #1a2b4a; --gold: #b8862a; --indigo: #4338ca;
            --muted: #6b7280; --border: #e5e2db; --faint: #f3f1ec;
            --accent: var(--indigo);
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: #1a1a1a; min-height: 100vh; overflow-x: hidden; }
        #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent), var(--gold)); z-index: 100; }
        .page { max-width: 900px; margin: 0 auto; padding: 0 28px; }
        
        .topbar { padding: 24px 0 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
        .bc-link { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted); text-decoration: none; text-transform: uppercase; transition: color .2s; }
        .bc-link:hover { color: var(--navy); }
        .bc-sep { color: var(--border); font-size: 11px; margin: 0 2px; }
        .bc-current { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
        .brand-link { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 900; letter-spacing: .08em; color: var(--navy); text-decoration: none; margin-right: 4px; }
        
        .header { padding: 52px 0 44px; border-bottom: 1px solid var(--border); }
        .header-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .22em; color: var(--accent); text-transform: uppercase; margin-bottom: 14px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 54px); font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; color: var(--navy); }
        .header h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
        .header-sub { margin-top: 12px; font-size: 14px; font-weight: 300; color: var(--muted); max-width: 480px; line-height: 1.7; }
        
        .section { padding: 44px 0 32px; }
        .section-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
        .section-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
        .section-line { flex: 1; height: 1px; background: var(--border); }
        
        .year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
        .year-card { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 20px 18px; position: relative; overflow: hidden; transition: all .24s ease; }
        .year-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); opacity: .7; transition: opacity .24s; }
        .year-card.active:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.08); }
        .year-card.active:hover::before { opacity: 1; }
        .year-card.active:hover .yc-arrow { color: var(--navy); transform: translateX(3px); }
        
        .yc-year { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
        .yc-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
        .yc-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--faint); padding-top: 12px; }
        .yc-status { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
        .yc-status.live { color: var(--accent); font-weight: 500; }
        .yc-arrow { font-size: 14px; color: #ccc; transition: all .24s ease; }

        footer { padding: 32px 0 48px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .footer-brand { font-family: 'Playfair Display', serif; font-size: 13px; color: #bbb; }
        .footer-note { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .12em; color: #ccc; text-transform: uppercase; }

        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        .fi { animation:fadeUp .4s ease forwards; opacity:0; }
        .fi:nth-child(1){animation-delay:.05s}.fi:nth-child(2){animation-delay:.10s}.fi:nth-child(3){animation-delay:.15s}.fi:nth-child(4){animation-delay:.20s}
        @media(max-width:480px){.year-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div id="progress"></div>
<div class="page">
    <nav class="topbar">
        <a href="../../index.html" class="brand-link">THE LOGIC</a>
        <span class="bc-sep">/</span>
        <span class="bc-current">고등학교 3학년 모의고사</span>
    </nav>
    <header class="header fi">
        <div class="header-eyebrow">Mock Exam · High 3</div>
        <h1>고등학교 <em>3학년</em></h1>
        <p class="header-sub">연도를 선택하여 평가원 모의고사 및 대수능 기출 분석 자료를 확인하세요.</p>
    </header>
    
    <section class="section">
        <div class="section-header"><span class="section-title">연도 선택</span><div class="section-line"></div></div>
        <div class="year-grid">
            
            <a href="2026/index.html" class="year-card active fi">
                <div class="yc-year">Archive</div>
                <div class="yc-title">2026년</div>
                <div class="yc-footer"><span class="yc-status live">● 서비스 중</span><span class="yc-arrow">→</span></div>
            </a>

            <a href="2025/index.html" class="year-card active fi">
                <div class="yc-year">Archive</div>
                <div class="yc-title">2025년</div>
                <div class="yc-footer"><span class="yc-status live">● 서비스 중</span><span class="yc-arrow">→</span></div>
            </a>

            <a href="2024/index.html" class="year-card active fi">
                <div class="yc-year">Archive</div>
                <div class="yc-title">2024년</div>
                <div class="yc-footer"><span class="yc-status live">● 서비스 중</span><span class="yc-arrow">→</span></div>
            </a>

            <a href="2023/index.html" class="year-card active fi">
                <div class="yc-year">Archive</div>
                <div class="yc-title">2023년</div>
                <div class="yc-footer"><span class="yc-status live">● 서비스 중</span><span class="yc-arrow">→</span></div>
            </a>

        </div>
    </section>
    
    <footer>
        <div class="footer-brand">THE LOGIC</div>
        <div class="footer-note">Mock Exam Portal · High 3</div>
    </footer>
</div>
<script>window.addEventListener('scroll',()=>{const e=document.getElementById('progress'),t=document.body.scrollHeight-window.innerHeight;e.style.width=(t>0?window.scrollY/t*100:0)+'%'});</script>
</body>
</html>
